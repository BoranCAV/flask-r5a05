        enonce: |
          Exercice 2 (5 points) : écris `PlayerSqliteORM` :
          - `__init__(db_uri)` et `connect()` ;
          - `_query_with_relations(session)` : `team` et `licence` (to-one), `trainings` (collection) ;
          - `findByTeam(team_name)` : les joueurs de l'équipe (nom exact), triés par numéro ;
