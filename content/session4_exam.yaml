        setup: |
          from sqlalchemy import Table, Column, Integer, String, ForeignKey, create_engine
          from sqlalchemy.orm import declarative_base, relationship, sessionmaker, joinedload, selectinload
          Base = declarative_base()
          player_trainings = Table('player_trainings', Base.metadata,
              Column('player_id', Integer, ForeignKey('players.id', ondelete='CASCADE'), primary_key=True),
              Column('training_id', Integer, ForeignKey('trainings.id', ondelete='CASCADE'), primary_key=True))
          class Team(Base):
              __tablename__ = 'teams'
              id = Column(Integer, primary_key=True)
              name = Column(String(100), unique=True, nullable=False)
              players = relationship('Player', back_populates='team')
          class Player(Base):
              __tablename__ = 'players'
              id = Column(Integer, primary_key=True)
              name = Column(String(150), nullable=False)
              number = Column(Integer)
              team_id = Column(Integer, ForeignKey('teams.id', ondelete='SET NULL'))
              team = relationship('Team', back_populates='players')
              licence = relationship('Licence', back_populates='player', uselist=False, cascade='all, delete-orphan')
              trainings = relationship('Training', secondary=player_trainings, back_populates='players')
          class Licence(Base):
              __tablename__ = 'licences'
              id = Column(Integer, primary_key=True)
              player_id = Column(Integer, ForeignKey('players.id', ondelete='CASCADE'), unique=True, nullable=False)
              code = Column(String(20), unique=True, nullable=False)
              player = relationship('Player', back_populates='licence')
          class Training(Base):
              __tablename__ = 'trainings'
              id = Column(Integer, primary_key=True)
              label = Column(String(100), nullable=False)
              players = relationship('Player', secondary=player_trainings, back_populates='trainings')
          def _fill(engine):
              Base.metadata.create_all(engine)
              s = sessionmaker(bind=engine)()
              lions, aigles = Team(name='Lions'), Team(name='Aigles')
              cardio, tir = Training(label='Cardio fractionné'), Training(label='Tir au but')
              s.add_all([
                  Player(name='Zoé', number=7, team=lions, licence=Licence(code='L7'), trainings=[cardio, tir]),
                  Player(name='Adam', number=10, team=lions, licence=Licence(code='L10'), trainings=[tir]),
                  Player(name='Inès', number=4, team=lions, trainings=[cardio]),
                  Player(name='Noah', number=9, team=aigles, trainings=[cardio]),
              ])
              s.commit()
              s.close()
          fake_module("app.models.Player", Player=Player)
          fake_module("app.models.Team", Team=Team)
          fake_module("app.models.Training", Training=Training)
        tests: |
          def _dao():
              d = PlayerSqliteORM("sqlite://")
              _fill(d.engine)
              return d

          def test_team():
              """findByTeam('Lions') → Inès (4), Zoé (7), Adam (10)"""
              res = _dao().findByTeam("Lions")
              assert [p.name for p in res] == ["Inès", "Zoé", "Adam"], f"obtenu {[p.name for p in res]}"

          def test_relations():
              """team, licence et trainings lisibles après close"""
              p = _dao().findByTeam("Lions")[1]
              try:
                  assert p.team.name == "Lions" and p.licence.code == "L7" and len(p.trainings) == 2
              except AssertionError:
                  raise
              except Exception as e:
                  raise AssertionError(f"{type(e).__name__} : relations non chargées d'avance")

          def test_training():
              """findByTraining('cardio') → Inès, Noah, Zoé"""
              assert [p.name for p in _dao().findByTraining("cardio")] == ["Inès", "Noah", "Zoé"]
        grille:
          - {critere: "`__init__` (`expire_on_commit=False`) et `connect()`", points: 1}
          - {critere: "`_query_with_relations` : `joinedload(team)`, `joinedload(licence)`, `selectinload(trainings)`", points: 1.5, auto: test_relations}
          - {critere: "`findByTeam` : `.join(Player.team).filter(Team.name == team_name).order_by(Player.number)`", points: 1, auto: test_team}
          - {critere: "`findByTraining` : `.join(Player.trainings).filter(Training.label.ilike(f\"%{label}%\")).order_by(Player.name)`", points: 1, auto: test_training}
          - {critere: "`try / finally: session.close()`", points: 0.5}
        solution: |
          from sqlalchemy import create_engine
          from sqlalchemy.orm import sessionmaker, joinedload, selectinload
          from app.models.Player import Player
          from app.models.Team import Team
          from app.models.Training import Training


          class PlayerSqliteORM:
              def __init__(self, db_uri="sqlite:///club.db"):
                  self.engine = create_engine(db_uri, echo=False)
                  self.SessionFactory = sessionmaker(bind=self.engine, expire_on_commit=False)

              def connect(self):
                  return self.SessionFactory()

              def _query_with_relations(self, session):
                  return session.query(Player).options(
                      joinedload(Player.team),
                      joinedload(Player.licence),
                      selectinload(Player.trainings)
                  )

              def findByTeam(self, team_name):
                  session = self.connect()
                  try:
                      return (
                          self._query_with_relations(session)
                          .join(Player.team)
                          .filter(Team.name == team_name)
                          .order_by(Player.number)
                          .all()
                      )
                  finally:
                      session.close()

              def findByTraining(self, label):
                  session = self.connect()
                  try:
                      return (
                          self._query_with_relations(session)
                          .join(Player.trainings)
                          .filter(Training.label.ilike(f"%{label}%"))
                          .order_by(Player.name)
                          .all()
                      )
                  finally:
                      session.close()
