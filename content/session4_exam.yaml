        enonce: |
          Exercice 3 (4 points) : écris, dans un seul fichier, `players_bp` et `create_app()` (qui enregistre le blueprint sous `/players`).
          - `GET /players/?team=Lions` : la liste JSON (`to_dict()`) des joueurs de l'équipe. Sans paramètre : tous les joueurs.
          - `GET /players/<id>` : le joueur en JSON, ou une erreur 404.
          Le service `PlayerService` (dans `app.services.PlayerService`) propose `getAllPlayers()`, `getPlayersByTeam(name)` et `getPlayerById(id)` (une liste).
        duree: 1200
        setup: |
          class _P:
              def __init__(self, id, name, team):
                  self.id, self.name, self.team = id, name, team
              def to_dict(self):
                  return {"id": self.id, "name": self.name}
          _D = [_P(1, "Zoé", "Lions"), _P(2, "Adam", "Lions"), _P(3, "Noah", "Aigles")]
          class _S:
              def __init__(self, *a, **k):
                  pass
              def getAllPlayers(self):
                  return list(_D)
              def getPlayersByTeam(self, n):
                  return [p for p in _D if p.team == n]
              def getPlayerById(self, id):
                  return [p for p in _D if p.id == id]
          fake_module("app.services.PlayerService", PlayerService=_S)
        tests: |
          def _c():
              app = create_app()
              assert app is not None, "create_app doit retourner app"
              return app.test_client()

          def test_tous():
              """GET /players/ → 3 joueurs"""
              r = _c().get("/players/")
              assert r.status_code == 200 and len(r.get_json()) == 3, f"statut {r.status_code}"

          def test_filtre():
              """GET /players/?team=Lions → Zoé, Adam"""
              assert [p["name"] for p in _c().get("/players/?team=Lions").get_json()] == ["Zoé", "Adam"]

          def test_detail():
              """GET /players/3 → Noah ; /players/8 → 404"""
              c = _c()
              d = c.get("/players/3").get_json()
              assert (d.get("name") if isinstance(d, dict) else d[0]["name"]) == "Noah"
              assert c.get("/players/8").status_code == 404
        grille:
          - {critere: "`players_bp = Blueprint('players', __name__)` + routes sur le blueprint", points: 0.5, auto: test_tous}
          - {critere: "`request.args.get('team')` + choix de la méthode du service", points: 1, auto: test_filtre}
          - {critere: "`'/<int:player_id>'` + `abort(404)` + `jsonify(...)`", points: 1, auto: test_detail}
          - {critere: "`create_app()` : `register_blueprint(players_bp, url_prefix='/players')` + `return app`", points: 1.5, auto: test_tous}
        solution: |
          from flask import Flask, Blueprint, request, jsonify, abort
          from app.services.PlayerService import PlayerService

          players_bp = Blueprint('players', __name__)


          @players_bp.route('/', methods=['GET'])
          def players():
              ps = PlayerService()
              team = request.args.get('team')
              data = ps.getPlayersByTeam(team) if team else ps.getAllPlayers()
              return jsonify([p.to_dict() for p in data])


          @players_bp.route('/<int:player_id>', methods=['GET'])
          def player_view(player_id):
              res = PlayerService().getPlayerById(player_id)
              if not res:
                  abort(404)
              return jsonify(res[0].to_dict())


          def create_app():
              app = Flask(__name__)
              app.register_blueprint(players_bp, url_prefix='/players')
              return app
