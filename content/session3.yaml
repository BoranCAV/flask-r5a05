  - id: "3.8"
    palier: 3
    title: "Écrire les modèles depuis un schéma inconnu"
    memo: |
      La méthode pour un schéma inconnu, sur le modèle du TD03 :
      - Lister les tables. Les tables à 2 FK avec une PK composée deviennent des `Table` dans `associations.py`.
      - Pour chaque autre table : `class X(Base, BaseModelMixin)`, `__tablename__`, puis les colonnes avec leurs options (`nullable`, `unique`, `default`).
      - Pour chaque FK : une `ForeignKey('table.id', ondelete=...)` du côté de la FK, puis une `relationship` **des deux côtés**, avec `back_populates`.
      - Une FK `UNIQUE` donne une relation 1-1 : `uselist=False` côté parent, et en général `cascade='all, delete-orphan'`.
      - Une FK `ON DELETE CASCADE` justifie une `cascade='all, delete-orphan'` sur la relation du parent.
      - Ajouter les `@property` utiles aux templates (`powers_str`, `average_danger`…).
    example: |
      # CREATE TABLE missions (
      #     id INTEGER PRIMARY KEY AUTOINCREMENT,
      #     hero_id INTEGER NOT NULL REFERENCES superheroes(id) ON DELETE CASCADE,
      #     title VARCHAR(150) NOT NULL,
      #     danger_level INTEGER DEFAULT 3,
      #     status VARCHAR(50) DEFAULT 'Completed'
      # )
      class Mission(Base, BaseModelMixin):
          __tablename__ = 'missions'
          id = Column(Integer, primary_key=True, autoincrement=True)
          hero_id = Column(Integer, ForeignKey('superheroes.id', ondelete='CASCADE'), nullable=False, index=True)
          title = Column(String(150), nullable=False)
          danger_level = Column(Integer, default=3)
          status = Column(String(50), default="Completed")
          superhero = relationship('Superhero', back_populates='missions')
