      - type: code
        tags: [schema-to-model, relation-1N, ondelete]
        enonce: |
          Festival de musique. Écris les modèles qui correspondent à ce schéma (`Base` est fournie) :
          - `stages(id PK, name VARCHAR(100) NOT NULL UNIQUE, capacity INTEGER NOT NULL DEFAULT 1000)`
          - `artists(id PK, name VARCHAR(150) NOT NULL UNIQUE)`
          - `concerts(id PK, artist_id INTEGER NOT NULL REFERENCES artists(id) ON DELETE CASCADE, stage_id INTEGER REFERENCES stages(id) ON DELETE SET NULL, day INTEGER NOT NULL, start_hour INTEGER)`
          Les relations : `Artist.concerts` ↔ `Concert.artist` (avec cascade) et `Stage.concerts` ↔ `Concert.stage`.
        setup: |
          from sqlalchemy.orm import declarative_base
          Base = declarative_base()
        starter: |
          from sqlalchemy import Column, Integer, String, ForeignKey
          from sqlalchemy.orm import relationship


          class Stage(Base):
              __tablename__ = 'stages'


          class Artist(Base):
              __tablename__ = 'artists'


          class Concert(Base):
              __tablename__ = 'concerts'
        tests: |
          from sqlalchemy import inspect, create_engine
          from sqlalchemy.orm import sessionmaker

          def test_stage():
              """stages : name unique et obligatoire, capacity défaut 1000 et obligatoire"""
              c = Stage.__table__.c
              assert c.name.unique and c.name.nullable is False
              assert c.capacity.nullable is False and c.capacity.default is not None and c.capacity.default.arg == 1000

          def test_concert_fk():
              """concerts : artist_id CASCADE non nul, stage_id SET NULL nullable, day obligatoire"""
              c = Concert.__table__.c
              fa, fs = list(c.artist_id.foreign_keys)[0], list(c.stage_id.foreign_keys)[0]
              assert (fa.target_fullname, fa.ondelete, c.artist_id.nullable) == ("artists.id", "CASCADE", False)
              assert (fs.target_fullname, fs.ondelete) == ("stages.id", "SET NULL") and c.stage_id.nullable
              assert c.day.nullable is False

          def test_relations():
              """Artist.concerts (cascade) ↔ Concert.artist ; Stage.concerts ↔ Concert.stage"""
              ra = inspect(Artist).relationships["concerts"]
              assert ra.back_populates == "artist" and ra.cascade.delete_orphan
              assert inspect(Stage).relationships["concerts"].back_populates == "stage"
              assert inspect(Concert).relationships["stage"].back_populates == "concerts"

          def test_comportement():
              """supprimer une scène garde le concert (stage_id à None), supprimer l'artiste supprime le concert"""
              e = create_engine("sqlite://")
              Base.metadata.create_all(e)
              s = sessionmaker(bind=e)()
              st, ar = Stage(name="Grande scène"), Artist(name="Justice")
              s.add(Concert(artist=ar, stage=st, day=1, start_hour=22))
              s.commit()
              s.delete(st)
              s.commit()
              assert s.query(Concert).one().stage_id is None
              s.delete(ar)
              s.commit()
              assert s.query(Concert).count() == 0
        solution: |
          from sqlalchemy import Column, Integer, String, ForeignKey
          from sqlalchemy.orm import relationship


          class Stage(Base):
              __tablename__ = 'stages'
              id = Column(Integer, primary_key=True, autoincrement=True)
              name = Column(String(100), unique=True, nullable=False)
              capacity = Column(Integer, nullable=False, default=1000)
              concerts = relationship('Concert', back_populates='stage')


          class Artist(Base):
              __tablename__ = 'artists'
              id = Column(Integer, primary_key=True, autoincrement=True)
              name = Column(String(150), unique=True, nullable=False)
              concerts = relationship('Concert', back_populates='artist', cascade='all, delete-orphan')


          class Concert(Base):
              __tablename__ = 'concerts'
              id = Column(Integer, primary_key=True, autoincrement=True)
              artist_id = Column(Integer, ForeignKey('artists.id', ondelete='CASCADE'), nullable=False)
              stage_id = Column(Integer, ForeignKey('stages.id', ondelete='SET NULL'), nullable=True)
              day = Column(Integer, nullable=False)
              start_hour = Column(Integer)
              artist = relationship('Artist', back_populates='concerts')
              stage = relationship('Stage', back_populates='concerts')
        indices:
          - "La FK avec `ON DELETE CASCADE` justifie `cascade='all, delete-orphan'` sur `Artist.concerts`."
          - "Pas de cascade sur `Stage.concerts` : supprimer la scène met `stage_id` à NULL."
