        tests: |
          def _dao():
              dao = StudentSqliteORM("sqlite://")
              _fill(dao.engine)
              return dao

          def test_par_classe():
              """findByClasse('BUT3-A') renvoie Lina et Sami"""
              res = _dao().findByClasse("BUT3-A")
              assert sorted(s.name for s in res) == ["Lina", "Sami"], f"obtenu {[s.name for s in res]} (jointure manquante ?)"

          def test_classe_apres_close():
              """eleve.classe.name est lisible après la fermeture de la session"""
              res = _dao().findByClasse("BUT3-B")
              try:
                  assert res[0].classe.name == "BUT3-B"
              except AssertionError:
                  raise
              except Exception as e:
                  raise AssertionError(f"{type(e).__name__} : expire_on_commit=False et joinedload(Student.classe)")

          def test_by_id():
              """findById(1) renvoie [Lina], findById(99) renvoie []"""
              dao = _dao()
              res = dao.findById(1)
              assert isinstance(res, list) and len(res) == 1 and res[0].name == "Lina", f"obtenu {res!r}"
              assert dao.findById(99) == []
        solution: |
          from sqlalchemy import create_engine
          from sqlalchemy.orm import sessionmaker, joinedload


          class StudentSqliteORM:
              def __init__(self, db_uri="sqlite://"):
                  self.engine = create_engine(db_uri)
                  self.SessionFactory = sessionmaker(bind=self.engine, expire_on_commit=False)

              def connect(self):
                  return self.SessionFactory()

              def findByClasse(self, classe_name):
                  session = self.connect()
                  try:
                      return (
                          session.query(Student)
                          .options(joinedload(Student.classe))
                          .join(Student.classe)
                          .filter(Classe.name == classe_name)
                          .all()
                      )
                  finally:
                      session.close()

              def findById(self, id):
                  session = self.connect()
                  try:
                      student = session.query(Student).filter(Student.id == id).first()
                      return [student] if student else []
                  finally:
                      session.close()
        indices:
          - "Commence par l'erreur de syntaxe : `=` au lieu de `==` dans un `filter`."
          - "`connect()` doit renvoyer une session, c'est-à-dire `self.SessionFactory()` avec les parenthèses."
          - "Pour filtrer sur `Classe.name`, il faut `.join(Student.classe)`."
