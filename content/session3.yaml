  # ===================================================================== BONUS (hors contrôle)
  - id: "3.B1"
    palier: 5
    bonus: 1
    title: "Bonus hors contrôle : Jinja en 5 minutes"
    memo: |
      Ces notions ne sont **pas au contrôle**. Elles servent seulement à comprendre les templates du cours.
      - `{% extends 'layout.html' %}` + `{% block content %}...{% endblock %}` : l'héritage de template.
      - `{% include 'nav.html' %}` insère un fragment.
      - `{{ data["firstname"]|capitalize }}` : une variable, puis un filtre après la barre verticale.
      - `{% for m in movies %}...{% endfor %}`, `{% if ... %}...{% endif %}` : les instructions.
      - `{{ url_for('movies.moviesByYear', myear=1999) }}` : des liens sans URL codée en dur.
    example: |
      {% extends 'layout.html' %}
      {% block content %}
        <h1>{{ data["firstname"]|capitalize }} {{ data["lastname"]|upper }}</h1>
        {% for movie in movies %}
          <a href="{{ url_for('movies.movieView', movie_id=movie.id) }}">{{ movie.title }}</a>
        {% endfor %}
      {% endblock %}
    exercises:
      - type: qcm
        tags: [jinja]
        enonce: "Quelle balise insère le contenu d'une page dans le `layout.html` commun ?"
        choices: ["`{% extends 'layout.html' %}` + `{% block content %}`", "`{% include 'layout.html' %}`", "`{{ layout }}`", "`{% import layout %}`"]
        answer: 0
      - type: trous
        tags: [jinja]
        enonce: "Complète la boucle sur les films."
        code: |
          {% [[0]] movie in movies %}
            <li>{{ movie.[[1]] }}</li>
          {% [[2]] %}
        blanks: [["for"], ["title"], ["endfor"]]
      - type: qcm
        tags: [jinja]
        enonce: "Que produit `{{ 'gaël'|capitalize }}` ?"
        choices: ["`Gaël`", "`GAËL`", "`gaël`", "Une erreur"]
        answer: 0
      - type: vf
        tags: [jinja]
        enonce: "Jinja fait partie du périmètre du contrôle."
        answer: false
        explication: "Faux : Jinja est hors contrôle, de même que la gestion des utilisateurs."

  - id: "3.B2"
    palier: 5
    bonus: 1
    title: "Bonus hors contrôle : gestion des utilisateurs"
    memo: |
      Ces notions ne sont **pas au contrôle**. Elles sont là pour la culture.
      - La session Flask (un cookie signé avec `app.secret_key`) : `session['logged'] = True`, `session['username'] = ...`.
      - Les mots de passe sont **chiffrés** (bcrypt) : `bcrypt.hashpw(pwd.encode(), bcrypt.gensalt())`, puis `bcrypt.checkpw(...)`.
      - Le décorateur maison `reqlogged` redirige vers la page de login si l'utilisateur n'est pas connecté.
      - Les mixins classiques des bibliothèques : `UserMixin` (Flask-Login).
    example: |
      from functools import wraps
      from flask import session, redirect, url_for

      def reqlogged(f):
          @wraps(f)
          def wrap(*args, **kwargs):
              if not session.get('logged'):
                  return redirect(url_for('auth.login'))
              return f(*args, **kwargs)
          return wrap
