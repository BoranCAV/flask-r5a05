          from flask import Blueprint, request, jsonify
          from app.services.FestivalService import FestivalService

          concerts_bp = Blueprint('concerts', __name__, template_folder='templates')


          @concerts_bp.route('/', methods=['GET'])
          def concerts():
              fs = FestivalService()
              day = request.args.get('day')
              if day:
                  return jsonify(fs.getProgramme(int(day)))
              return jsonify(fs.getConcertsPerStage())
      - type: papier
        tags: [property, super, mixin]
        enonce: "Écris, pour `Artist`, une `@property genres_str` (`\"Électro, House\"`), une `@property concerts_count`, et la surcharge `__getitem__`, qui renvoie `genres_str` pour la clé `'genres'` et délègue au mixin sinon. Écris seulement ces méthodes."
        duree: 300
        grille:
          - {critere: "`@property def genres_str(self): return \", \".join(g.name for g in self.genres)`", points: 1.5}
          - {critere: "`@property def concerts_count(self): return len(self.concerts)`", points: 1}
          - {critere: "`if item == 'genres': return self.genres_str`", points: 1}
          - {critere: "`return super().__getitem__(item)`", points: 1.5}
        solution: |
          @property
          def genres_str(self):
              if not self.genres:
                  return ""
              return ", ".join(g.name for g in self.genres)

          @property
          def concerts_count(self):
              return len(self.concerts)

          def __getitem__(self, item):
              if item == "genres":
                  return self.genres_str
              return super().__getitem__(item)
      - type: papier
        tags: [n-plus-1, loading]
        enonce: "Question de cours : la page « programme du jour » affiche pour chaque concert le nom de l'artiste et celui de la scène. Que se passe-t-il sans chargement anticipé ? Comment l'éviter, et pourquoi `joinedload` ici ?"
        duree: 300
        grille:
          - {critere: "Sans eager loading, chaque `concert.artist` et `concert.stage` déclenche une requête : c'est le problème N+1", points: 1}
          - {critere: "Après `session.close()`, l'accès lazy plante (`DetachedInstanceError`)", points: 1}
          - {critere: "Solution : `options(joinedload(Concert.artist), joinedload(Concert.stage))` dans `_query_with_relations`", points: 1}
          - {critere: "`joinedload`, car ce sont des relations to-one (N-1) : une seule requête avec jointure", points: 1}
        solution: |
          Sans chargement anticipé, la requête ramène N concerts, puis chaque accès à concert.artist et
          concert.stage déclenche une requête supplémentaire : 1 + 2N requêtes (problème N+1). En plus, la
          session étant fermée par le DAO, l'accès lazy dans le template lève DetachedInstanceError.
          On centralise dans _query_with_relations : session.query(Concert).options(joinedload(Concert.artist),
          joinedload(Concert.stage)). joinedload convient car artist et stage sont des relations to-one
          (N-1) : une seule requête avec LEFT OUTER JOIN, sans duplication de lignes.

  - id: "3.12"
    palier: 4
    title: "Sujet papier C : gestion d'école"
    memo: |
      **Sujet.** Une application `school`.
      - Le schéma : `classes(id, name UNIQUE)`, `students(id, name NOT NULL, classe_id → classes ON DELETE SET NULL)`, `subjects(id, name UNIQUE)`, `grades(id, value FLOAT NOT NULL, student_id NOT NULL → students ON DELETE CASCADE, subject_id NOT NULL → subjects ON DELETE CASCADE)`.
      - Les user stories : voir les élèves d'une classe, voir la fiche d'un élève avec sa moyenne, voir le classement d'une classe.
    exercises:
      - type: papier
        tags: [schema-to-model, property, cascade]
        enonce: "Écris `Student` (avec `classe` et `grades`), `Subject` et `Grade`, et une `@property average` sur `Student` (arrondie à 1 décimale, `None` s'il n'y a pas de note). `Classe` existe déjà (`Classe.students` a `back_populates='classe'`)."
        duree: 660
        setup: |
          from sqlalchemy import Column, Integer, String, ForeignKey
          from sqlalchemy.orm import declarative_base, relationship
          Base = declarative_base()
          class Classe(Base):
              __tablename__ = 'classes'
              id = Column(Integer, primary_key=True)
              name = Column(String(50), unique=True, nullable=False)
              students = relationship('Student', back_populates='classe')
        tests: |
          from sqlalchemy import inspect, create_engine
          from sqlalchemy.orm import sessionmaker

          def test_fk():
              """classe_id SET NULL ; grades.student_id et subject_id CASCADE non nuls"""
              assert list(Student.__table__.c.classe_id.foreign_keys)[0].ondelete == "SET NULL"
              g = Grade.__table__.c
              assert list(g.student_id.foreign_keys)[0].target_fullname == "students.id" and g.student_id.nullable is False
              assert list(g.subject_id.foreign_keys)[0].target_fullname == "subjects.id"

          def test_relations():
              """Student.grades (cascade) ↔ Grade.student ; Subject.grades ↔ Grade.subject"""
              r = inspect(Student).relationships
              assert r["classe"].back_populates == "students"
              assert r["grades"].back_populates == "student" and r["grades"].cascade.delete_orphan
              assert inspect(Subject).relationships["grades"].back_populates == "subject"

          def test_average():
              """average (propriété) : 13.7 ; None sans note"""
              st = Student(name="Lina")
              m = Subject(name="Maths")
              st.grades = [Grade(value=12, subject=m), Grade(value=15, subject=m), Grade(value=14, subject=m)]
              assert st.average == 13.7
              assert Student(name="X").average is None

          def test_cascade():
              """supprimer l'élève supprime ses notes"""
              e = create_engine("sqlite://")
              Base.metadata.create_all(e)
              s = sessionmaker(bind=e)()
              st = Student(name="Lina", classe=Classe(name="A"))
              st.grades = [Grade(value=10, subject=Subject(name="Info"))]
              s.add(st)
              s.commit()
              s.delete(st)
              s.commit()
              assert s.query(Grade).count() == 0
        grille:
          - {critere: "`Student` : `classe_id` FK `classes.id` en `SET NULL` + `classe = relationship(...)`", points: 1.5, auto: test_fk}
          - {critere: "`Student.grades = relationship('Grade', back_populates='student', cascade='all, delete-orphan')`", points: 1.5, auto: test_cascade}
          - {critere: "`Grade` : 2 FK `CASCADE` non nulles, `value` obligatoire, 2 relations", points: 1.5, auto: test_relations}
          - {critere: "`Subject` : `name` unique, `grades = relationship('Grade', back_populates='subject')`", points: 1, auto: test_relations}
          - {critere: "`@property average` avec garde-fou et `round(..., 1)`", points: 1.5, auto: test_average}
        solution: |
          from sqlalchemy import Column, Integer, String, Float, ForeignKey
          from sqlalchemy.orm import relationship


          class Student(Base):
              __tablename__ = 'students'
              id = Column(Integer, primary_key=True, autoincrement=True)
              name = Column(String(100), nullable=False)
              classe_id = Column(Integer, ForeignKey('classes.id', ondelete='SET NULL'), nullable=True)
              classe = relationship('Classe', back_populates='students')
              grades = relationship('Grade', back_populates='student', cascade='all, delete-orphan')

              @property
              def average(self):
                  if not self.grades:
                      return None
                  return round(sum(g.value for g in self.grades) / len(self.grades), 1)


          class Subject(Base):
              __tablename__ = 'subjects'
              id = Column(Integer, primary_key=True, autoincrement=True)
              name = Column(String(100), unique=True, nullable=False)
              grades = relationship('Grade', back_populates='subject')


          class Grade(Base):
              __tablename__ = 'grades'
              id = Column(Integer, primary_key=True, autoincrement=True)
              value = Column(Float, nullable=False)
              student_id = Column(Integer, ForeignKey('students.id', ondelete='CASCADE'), nullable=False)
              subject_id = Column(Integer, ForeignKey('subjects.id', ondelete='CASCADE'), nullable=False)
              student = relationship('Student', back_populates='grades')
              subject = relationship('Subject', back_populates='grades')
      - type: papier
        tags: [dao-orm, loading, join]
        enonce: "Écris `StudentSqliteORM` : `__init__(db_uri)`, `connect()`, `_query_with_relations` (`classe` en to-one, `grades` en collection), `findByClasse(name)` (triés par nom) et `findById(id)` (qui renvoie `[eleve]` ou `[]`)."
        duree: 600
        setup: |
          from sqlalchemy import Column, Integer, String, Float, ForeignKey, create_engine
          from sqlalchemy.orm import declarative_base, relationship, sessionmaker, joinedload, selectinload
          Base = declarative_base()
          class Classe(Base):
              __tablename__ = 'classes'
              id = Column(Integer, primary_key=True)
              name = Column(String(50), unique=True, nullable=False)
              students = relationship('Student', back_populates='classe')
          class Student(Base):
              __tablename__ = 'students'
              id = Column(Integer, primary_key=True)
              name = Column(String(100), nullable=False)
              classe_id = Column(Integer, ForeignKey('classes.id', ondelete='SET NULL'))
              classe = relationship('Classe', back_populates='students')
              grades = relationship('Grade', back_populates='student', cascade='all, delete-orphan')
          class Grade(Base):
              __tablename__ = 'grades'
              id = Column(Integer, primary_key=True)
              value = Column(Float, nullable=False)
              student_id = Column(Integer, ForeignKey('students.id', ondelete='CASCADE'), nullable=False)
              student = relationship('Student', back_populates='grades')
          def _fill(engine):
              Base.metadata.create_all(engine)
              s = sessionmaker(bind=engine)()
              a, b = Classe(name='BUT3-A'), Classe(name='BUT3-B')
              s.add_all([
                  Student(name='Sami', classe=a, grades=[Grade(value=11)]),
                  Student(name='Lina', classe=a, grades=[Grade(value=15), Grade(value=13)]),
                  Student(name='Hugo', classe=b, grades=[]),
              ])
              s.commit()
              s.close()
          fake_module("app.models.Student", Student=Student)
          fake_module("app.models.Classe", Classe=Classe)
        tests: |
          def _dao():
              d = StudentSqliteORM("sqlite://")
              _fill(d.engine)
              return d

          def test_classe():
              """findByClasse('BUT3-A') → Lina, Sami (triés), classe et notes lisibles"""
              res = _dao().findByClasse("BUT3-A")
              assert [s.name for s in res] == ["Lina", "Sami"]
              try:
                  assert res[0].classe.name == "BUT3-A" and len(res[0].grades) == 2
              except AssertionError:
                  raise
              except Exception as e:
                  raise AssertionError(f"{type(e).__name__} : relations non chargées")

          def test_by_id():
              """findById(3) → [Hugo], findById(9) → []"""
              d = _dao()
              assert [s.name for s in d.findById(3)] == ["Hugo"] and d.findById(9) == []
        grille:
          - {critere: "`__init__` / `connect` avec `expire_on_commit=False`", points: 1}
          - {critere: "`_query_with_relations` : `joinedload(Student.classe)` + `selectinload(Student.grades)`", points: 1.5, auto: test_classe}
          - {critere: "`findByClasse` : `.join(Student.classe).filter(Classe.name == name).order_by(Student.name)`", points: 1.5, auto: test_classe}
          - {critere: "`findById` : `[s] if s else []`, `try / finally`", points: 1.5, auto: test_by_id}
        solution: |
          from sqlalchemy import create_engine
          from sqlalchemy.orm import sessionmaker, joinedload, selectinload
          from app.models.Student import Student
          from app.models.Classe import Classe


          class StudentSqliteORM:
              def __init__(self, db_uri="sqlite:///school.db"):
                  self.engine = create_engine(db_uri)
                  self.SessionFactory = sessionmaker(bind=self.engine, expire_on_commit=False)

              def connect(self):
                  return self.SessionFactory()

              def _query_with_relations(self, session):
                  return session.query(Student).options(
                      joinedload(Student.classe),
                      selectinload(Student.grades)
                  )

              def findByClasse(self, name):
                  session = self.connect()
                  try:
                      return (
                          self._query_with_relations(session)
                          .join(Student.classe)
                          .filter(Classe.name == name)
                          .order_by(Student.name)
                          .all()
                      )
                  finally:
                      session.close()

              def findById(self, id):
                  session = self.connect()
                  try:
                      s = self._query_with_relations(session).filter(Student.id == id).first()
                      return [s] if s else []
                  finally:
                      session.close()
