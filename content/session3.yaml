          from sqlalchemy import create_engine
          from sqlalchemy.orm import sessionmaker, joinedload, selectinload
          from app.models.Book import Book
          from app.models.Author import Author


          class BookSqliteORM:
              def __init__(self, db_uri="sqlite:///library.db"):
                  self.engine = create_engine(db_uri, echo=False)
                  self.SessionFactory = sessionmaker(bind=self.engine, expire_on_commit=False)

              def connect(self):
                  return self.SessionFactory()

              def _query_with_relations(self, session):
                  return session.query(Book).options(
                      joinedload(Book.author),
                      selectinload(Book.tags)
                  )

              def findAll(self, limit=None):
                  session = self.connect()
                  try:
                      query = self._query_with_relations(session).order_by(Book.title)
                      if limit is not None:
                          query = query.limit(limit)
                      return query.all()
                  finally:
                      session.close()

              def findByAuthor(self, name):
                  session = self.connect()
                  try:
                      return (
                          self._query_with_relations(session)
                          .join(Book.author)
                          .filter(Author.name.ilike(f"%{name}%"))
                          .all()
                      )
                  finally:
                      session.close()
