          - {critere: "Modèle : la `@property average` calcule la moyenne de chaque élève ; réponse `jsonify` (ou template)", points: 1}
        solution: |
          1. Le blueprint students (routes.py) : @students_bp.route('/ranking/<string:classe>') reçoit classe='BUT3-A'
             et instancie SchoolService.
