          - {critere: "`__init__` + `connect()` (avec `expire_on_commit=False`)", points: 1}
          - {critere: "`findByDay` : `filter(Concert.day == day).order_by(Concert.start_hour)`", points: 1.5, auto: test_day}
          - {critere: "`joinedload(Concert.artist)` et `joinedload(Concert.stage)`", points: 1.5, auto: test_stage}
          - {critere: "`findByStage` : `.join(Concert.stage).filter(Stage.name.ilike(...))`", points: 1.5, auto: test_stage}
