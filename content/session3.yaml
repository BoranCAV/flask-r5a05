  - id: "3.7"
    palier: 3
    title: "Débugger une application complète (domaine : école)"
    memo: |
      Les erreurs typiques, à reconnaître au premier coup d'œil :
      - `NoReferencedTableError ... could not find table 'Classe'` : la `ForeignKey` vise le nom de la **classe** au lieu de celui de la **table** (`'classes.id'`).
      - `back_populates` incohérent (`'class'` d'un côté, `'classe'` de l'autre) : erreur à la configuration des mappers.
      - Une 404 sur une route qui existe : le blueprint n'est pas enregistré, ou le `url_prefix` est faux (il doit commencer par `/`).
      - Rien n'est écrit en base : le `commit()` est oublié. Des connexions qui fuient : `session.close` sans parenthèses, ou pas de `finally`.
      - `DetachedInstanceError` dans le template : la relation n'est pas chargée d'avance, ou `expire_on_commit` est resté à `True`.
      - Une date de création figée : `default=datetime.utcnow()` au lieu de `default=datetime.utcnow`.
    example: |
      # version correcte du DAO d'élèves
      class StudentSqliteORM(StudentDAOInterface):
          def __init__(self, db_uri):
              self.engine = create_engine(db_uri)
              self.SessionFactory = sessionmaker(bind=self.engine, expire_on_commit=False)

          def connect(self):
              return self.SessionFactory()                  # une session (avec les parenthèses)

          def findByClasse(self, classe_name):
              session = self.connect()
              try:
                  return (session.query(Student)
                          .options(joinedload(Student.classe))
                          .join(Student.classe)
                          .filter(Classe.name == classe_name)
                          .all())
              finally:
                  session.close()                           # avec les parenthèses
