        solution: |
          from sqlalchemy import create_engine
          from sqlalchemy.orm import sessionmaker, joinedload
          from app.models.Concert import Concert
          from app.models.Stage import Stage


          class ConcertSqliteORM:
              def __init__(self, db_uri="sqlite:///festival.db"):
                  self.engine = create_engine(db_uri)
                  self.SessionFactory = sessionmaker(bind=self.engine, expire_on_commit=False)

              def connect(self):
                  return self.SessionFactory()

              def _query_with_relations(self, session):
                  return session.query(Concert).options(joinedload(Concert.artist), joinedload(Concert.stage))

              def findByDay(self, day):
                  session = self.connect()
                  try:
                      return (
                          self._query_with_relations(session)
                          .filter(Concert.day == day)
                          .order_by(Concert.start_hour)
                          .all()
                      )
                  finally:
                      session.close()

              def findByStage(self, stage_name):
                  session = self.connect()
                  try:
                      return (
                          self._query_with_relations(session)
                          .join(Concert.stage)
                          .filter(Stage.name.ilike(f"%{stage_name}%"))
                          .all()
                      )
                  finally:
                      session.close()
