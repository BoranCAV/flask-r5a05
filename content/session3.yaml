          from flask import current_app
          from app.models.BookDAO import BookSqliteORM
          from app.models.Book import Book
          from app.models.Author import Author
          from app.models.Tag import Tag


          class BookService:
              def __init__(self, db_path=None, db_uri=None):
                  if db_uri is None and db_path is None:
                      try:
                          db_uri = current_app.config.get('SQLALCHEMY_DATABASE_URI')
                          db_path = current_app.config.get('DATABASE_PATH')
                      except RuntimeError:
                          pass
                  self.bdao = BookSqliteORM(db_path=db_path, db_uri=db_uri)

              def getBooksByTag(self, tag):
                  return self.bdao.findByTag(tag)

              def getYears(self):
                  session = self.bdao.connect()
                  try:
                      years = (
                          session.query(Book.year)
                          .filter(Book.year.isnot(None))
                          .distinct()
                          .order_by(Book.year)
                          .all()
                      )
                      return [y[0] for y in years]
                  finally:
                      session.close()

              def getStatsSummary(self):
                  session = self.bdao.connect()
                  try:
                      return {
                          "total_books": session.query(Book).count(),
                          "total_authors": session.query(Author).count(),
                          "total_tags": session.query(Tag).count(),
                      }
                  finally:
                      session.close()
