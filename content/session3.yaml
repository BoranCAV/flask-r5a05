              subject = relationship('Subject', back_populates='grade')
        tests: |
          import time
          from sqlalchemy import inspect, create_engine
          from sqlalchemy.orm import sessionmaker

          def test_mappers():
              """les relations sont cohérentes (back_populates)"""
              try:
                  rs = inspect(Student).relationships
                  assert rs["grades"].back_populates == "student", "Student.grades doit pointer vers 'student'"
                  assert inspect(Grade).relationships["subject"].back_populates == "grades"
              except AssertionError:
                  raise
              except Exception as e:
                  raise AssertionError(f"{type(e).__name__} : {e}"[:200])

