        solution: |
          from flask import Blueprint, request, jsonify, abort
          from app.services.BookService import BookService

          books_bp = Blueprint('books', __name__, template_folder='templates')


          @books_bp.route('/', methods=['GET'])
          def books():
              bs = BookService()
              tag = request.args.get('tag')
              author = request.args.get('author')
              if tag:
                  data = bs.getBooksByTag(tag)
              elif author:
                  data = bs.getBooksByAuthor(author)
              else:
                  data = bs.getAllBooks()
              return jsonify([b.to_dict() for b in data])


          @books_bp.route('/<int:book_id>', methods=['GET'])
          def book_detail(book_id):
              book = BookService().getBookById(book_id)
              if not book:
                  abort(404)
              return jsonify(book[0].to_dict())
