          from typing import List, Dict


          class FestivalService:
              def __init__(self, dao):
                  self.cdao = dao

              def getProgramme(self, day: int) -> List[str]:
                  return [f"{c.start_hour}h · {c.artist.name} ({c.stage.name})" for c in self.cdao.findByDay(day)]

