session:
  id: 3
  title: "Tout assembler"
  subtitle: "D'un schéma SQL inconnu à l'application complète : modèles, DAO ORM, service, blueprints filtrés (patron super-héros)."
  palier_names:
    5: "Bonus (hors contrôle)"

lessons:
  # ===================================================================== PALIER 1
  - id: "3.1"
    palier: 1
    title: "Du schéma SQL aux modèles"
    memo: |
      - `id INTEGER PRIMARY KEY AUTOINCREMENT` → `Column(Integer, primary_key=True, autoincrement=True)`
      - `name VARCHAR(100) NOT NULL UNIQUE` → `Column(String(100), nullable=False, unique=True)`
      - `universe VARCHAR(50) NOT NULL DEFAULT 'Marvel'` → `Column(String(50), nullable=False, default="Marvel")`
      - `city_id INTEGER REFERENCES cities(id) ON DELETE SET NULL` → `Column(Integer, ForeignKey('cities.id', ondelete='SET NULL'), nullable=True)`
      - Une table qui ne contient **que 2 FK** et une PK composée est une **table d'association** (N-N) : un objet `Table`, sans classe.
      - Une FK `UNIQUE` (`hero_id ... NOT NULL UNIQUE`) indique une relation **1-1** (`uselist=False` côté parent).
      - Une FK simple : N-1 du côté de la FK, 1-N de l'autre côté.
    example: |
      # CREATE TABLE superheroes (
      #     id INTEGER PRIMARY KEY AUTOINCREMENT,
      #     name VARCHAR(100) NOT NULL,
      #     universe VARCHAR(50) NOT NULL DEFAULT 'Marvel',
      #     city_id INTEGER REFERENCES cities(id) ON DELETE SET NULL
      # )
      class Superhero(Base, BaseModelMixin):
          __tablename__ = 'superheroes'
          id = Column(Integer, primary_key=True, autoincrement=True)
          name = Column(String(100), nullable=False, index=True)
          universe = Column(String(50), nullable=False, default="Marvel", index=True)
          city_id = Column(Integer, ForeignKey('cities.id', ondelete='SET NULL'), nullable=True, index=True)

          city = relationship('City', back_populates='superheroes')                  # N-1
          detail = relationship('HeroDetail', back_populates='superhero', uselist=False, cascade='all, delete-orphan')  # 1-1
          powers = relationship('Power', secondary=hero_powers, back_populates='superheroes')                         # N-N
          missions = relationship('Mission', back_populates='superhero', cascade='all, delete-orphan')                 # 1-N
    exercises:
      - type: qcm
        tags: [schema-to-model, association-table]
        enonce: "`CREATE TABLE hero_powers (hero_id INTEGER NOT NULL REFERENCES superheroes(id), power_id INTEGER NOT NULL REFERENCES powers(id), PRIMARY KEY (hero_id, power_id))`. Comment la traduire ?"
        choices: ["Une `Table` d'association (N-N), sans classe", "Une classe `HeroPower(Base)`", "Deux relations 1-N", "Une relation 1-1"]
        answer: 0
      - type: qcm
        tags: [schema-to-model, relation-11]
        enonce: "`hero_details.hero_id INTEGER NOT NULL UNIQUE REFERENCES superheroes(id)`. Quel type de relation entre un héros et ses détails ?"
        choices: ["1-1", "1-N", "N-N", "Aucune"]
        answer: 0
        explication: "La FK est unique : un héros a au plus une fiche de détails. Côté `Superhero`, on écrit `uselist=False`."
      - type: trous
        tags: [schema-to-model, foreign-key, ondelete]
        enonce: "Traduis `city_id INTEGER REFERENCES cities(id) ON DELETE SET NULL`."
        code: |
          city_id = Column(Integer, [[0]]([[1]], ondelete=[[2]]), nullable=True)
        blanks:
          - ["ForeignKey"]
          - ["'cities.id'"]
          - ["'SET NULL'"]
      - type: relier
        tags: [schema-to-model, column-options]
        enonce: "Relie chaque morceau de SQL à sa traduction SQLAlchemy."
        pairs:
          - ["NOT NULL", "nullable=False"]
          - ["UNIQUE", "unique=True"]
          - ["DEFAULT 50", "default=50"]
          - ["REFERENCES teams(id)", "ForeignKey('teams.id')"]
          - ["VARCHAR(150)", "String(150)"]
      - type: vf
        tags: [schema-to-model]
        enonce: "`alignment VARCHAR(20) DEFAULT 'Hero'` se traduit par `alignment = Column(String(20), default=\"Hero\")`."
        answer: true
      - type: ordre
        tags: [schema-to-model, arborescence]
        enonce: "Remets dans l'ordre la méthode pour transformer un schéma SQL inconnu en modèles."
        lines:
          - "Repérer les tables d'association (2 FK + PK composée)"
          - "Écrire base.py (Base, BaseModelMixin, get_engine)"
          - "Écrire associations.py avec les objets Table"
          - "Écrire un modèle par table restante avec ses colonnes"
          - "Ajouter les relationship avec back_populates des deux côtés"
          - "Importer tous les modèles dans models/__init__.py"

  - id: "3.2"
    palier: 1
    title: "Organiser un projet complet"
    memo: |
      - `models/__init__.py` importe dans l'ordre : `base` → `associations` → les modèles → l'interface du DAO → le DAO, puis expose tout via `__all__`.
      - Il faut importer **tous** les modèles : `relationship('Mission')` est résolu par son nom, donc la classe doit avoir été chargée.
      - `services/` contient un service par domaine (`SuperheroService`).
      - `blueprints/` contient un blueprint par page ou fonctionnalité (`index`, `heroes`, `teams`, `powers`), chacun avec ses templates.
      - `create_app()` enregistre chaque blueprint avec son `url_prefix` (`/heroes`, `/teams`, `/powers`).
      - Rappel : un **module** est un fichier `.py`, un **package** est un dossier avec un `__init__.py`.
    example: |
      # app/models/__init__.py (TD03)
      from app.models.base import Base, BaseModelMixin, get_engine
      from app.models.associations import hero_powers, hero_teams
      from app.models.City import City
      from app.models.Power import Power
      from app.models.Team import Team
      from app.models.HeroDetail import HeroDetail
      from app.models.Superhero import Superhero
      from app.models.Mission import Mission
      from app.models.SuperheroDAOInterface import SuperheroDAOInterface
      from app.models.SuperheroDAO import SuperheroSqliteORM

      __all__ = ['Base', 'BaseModelMixin', 'get_engine', 'hero_powers', 'hero_teams', 'City', 'Power',
                 'Team', 'HeroDetail', 'Superhero', 'Mission', 'SuperheroDAOInterface', 'SuperheroSqliteORM']
    exercises:
      - type: ordre
        tags: [init-all, arborescence]
        enonce: "Remets dans l'ordre les imports de `app/models/__init__.py`."
        lines:
          - "from app.models.base import Base, BaseModelMixin, get_engine"
          - "from app.models.associations import hero_powers, hero_teams"
          - "from app.models.Superhero import Superhero"
          - "from app.models.SuperheroDAOInterface import SuperheroDAOInterface"
          - "from app.models.SuperheroDAO import SuperheroSqliteORM"
        explication: "Base d'abord, car tout en dépend. Puis les associations, qui utilisent `Base.metadata`, puis les modèles, et enfin le DAO, qui importe les modèles."
      - type: qcm
        tags: [init-all, relation-1N]
        enonce: "Pourquoi faut-il importer **tous** les modèles (`Mission` compris) dans `models/__init__.py` ?"
        choices: ["Parce que `relationship('Mission')` est résolu par son nom : la classe doit être chargée", "Pour que Flask trouve les templates", "Parce que `__all__` l'exige", "Ce n'est pas nécessaire"]
        answer: 0
      - type: relier
        tags: [arborescence]
        enonce: "Relie chaque fichier du TD03 à son contenu."
        pairs:
          - ["models/base.py", "Base, BaseModelMixin, get_engine()"]
          - ["models/associations.py", "Les tables hero_powers et hero_teams"]
          - ["models/SuperheroDAO.py", "La classe SuperheroSqliteORM"]
          - ["services/SuperheroService.py", "La logique métier (statistiques, univers…)"]
          - ["blueprints/heroes/routes.py", "heroes_bp et ses routes filtrées"]
      - type: trous
        tags: [register-bp, url-prefix]
        enonce: "Complète l'enregistrement des blueprints du TD03."
        code: |
          app.register_blueprint(index_bp)
          app.register_blueprint(heroes_bp, [[0]]='/heroes')
          app.register_blueprint([[1]], url_prefix='/teams')
          app.register_blueprint(powers_bp, url_prefix=[[2]])
        blanks:
          - ["url_prefix"]
          - ["teams_bp"]
          - ["'/powers'"]
      - type: vf
        tags: [relation-1N]
        enonce: "Dans `relationship('Mission', ...)`, on peut citer la classe par son nom (une chaîne) même si elle est définie dans un autre fichier, plus loin."
        answer: true
        explication: "La chaîne est résolue plus tard, à la configuration des mappers. Il faut seulement que la classe soit importée quelque part (d'où `models/__init__.py`)."
      - type: qcm
        tags: [service, mvcs]
        enonce: "Où placer `getStatsSummary()`, qui compte les héros, les équipes, les pouvoirs et les missions pour la page d'accueil ?"
        choices: ["Dans `SuperheroService`", "Dans le modèle `Superhero`", "Dans `index/routes.py`", "Dans `base.py`"]
        answer: 0

  - id: "3.3"
    palier: 1
    title: "Des user stories aux routes"
    memo: |
      - Une user story : « En tant qu'utilisateur, je veux… ». Pour chaque story, on décide d'une **route**, d'une **méthode HTTP**, des **paramètres** et d'une **méthode de service**.
      - Une liste filtrable (Marvel / DC) : la même route avec un query param, `/heroes/?universe=Marvel`.
      - Une fiche détaillée : un paramètre de chemin, `/heroes/<int:hero_id>`.
      - Un lien vers les héros d'une ville : `/heroes/city/<string:city_name>` (ou `?city=`).
      - Un tableau de bord d'accueil : `getStatsSummary()` dans le service, appelé par `index_bp`.
      - L'ordre de travail pour une fonctionnalité : DAO → service → route → template.
    example: |
      # « Je veux filtrer en un clic les héros de Marvel, de DC ou tous »
      @heroes_bp.route('/', methods=['GET'])
      def heroes():
          hs = SuperheroService()
          universe = request.args.get('universe')        # /heroes/?universe=DC
          if universe:
              heroes_data = hs.getHeroesByUniverse(universe)
          else:
              heroes_data = hs.getAllHeroes()
          return render_template('heroes_view.html', heroes=heroes_data)

      # « Je veux cliquer sur un héros pour voir sa fiche complète » → /heroes/9
      @heroes_bp.route('/<int:hero_id>', methods=['GET'])
      def hero_detail(hero_id):
          hero_data = SuperheroService().getHeroById(hero_id)
          return render_template('hero_detail.html', hero=hero_data[0] if hero_data else None)
    exercises:
      - type: relier
        tags: [user-story, route-params, request-args]
        enonce: "Relie chaque user story à la route qui la réalise."
        pairs:
          - ["Voir la fiche complète de Storm", "GET /heroes/9"]
          - ["Filtrer les héros de DC", "GET /heroes/?universe=DC"]
          - ["Voir tous les pouvoirs avec leurs héros", "GET /powers/"]
          - ["Voir les statistiques globales sur l'accueil", "GET /"]
      - type: qcm
        tags: [user-story, request-args]
        enonce: "« Je veux filtrer en un clic entre Marvel, DC ou tous. » Quelle solution le TD03 retient-il ?"
        choices: ["Un query param sur la liste : `/heroes/?universe=Marvel`", "Une route par univers codée en dur", "Un formulaire POST", "Un blueprint par univers"]
        answer: 0
      - type: trous
        tags: [route-params, user-story]
        enonce: "Complète la route de la fiche d'un héros."
        code: |
          @heroes_bp.route('/[[0]]', methods=['GET'])
          def hero_detail(hero_id):
              hero_data = SuperheroService().[[1]](hero_id)
              hero = hero_data[0] if hero_data else None
              return render_template('hero_detail.html', hero=hero)
        blanks:
          - ["<int:hero_id>"]
          - ["getHeroById"]
      - type: ordre
        tags: [user-story, mvcs]
        enonce: "Remets dans l'ordre le développement d'une fonctionnalité « voir les héros d'une équipe »."
        lines:
          - "Ajouter findByTeam(team_name) dans le DAO (join + ilike)"
          - "Ajouter getHeroesByTeam(team_name) dans le service"
          - "Ajouter la route /team/<string:team_name> dans heroes_bp"
          - "Réutiliser le template heroes_view.html avec les résultats"
      - type: vf
        tags: [user-story]
        enonce: "Une user story décrit d'abord l'implémentation technique (tables, classes) avant le besoin de l'utilisateur."
        answer: false
        explication: "Faux : elle part du point de vue de l'utilisateur (« en tant que… je veux… »). La technique en découle."
      - type: qcm
        tags: [user-story, service-stats]
        enonce: "« Je veux voir sur l'accueil le nombre de héros, d'équipes, de pouvoirs et de missions. » Quelle méthode écrire ?"
        choices: ["`getStatsSummary()` dans le service, qui fait des `.count()`", "Quatre routes distinctes", "Une propriété `@property` sur `Superhero`", "Un calcul dans le template"]
        answer: 0

  # ===================================================================== PALIER 2
  - id: "3.4"
    palier: 2
    title: "Le DAO ORM complet (patron SuperheroSqliteORM)"
    memo: |
      - `__init__(self, db_path=None, db_uri=None)` calcule `self.db_uri`, puis `self.engine = get_engine(self.db_uri)` et `self.SessionFactory = sessionmaker(bind=self.engine, expire_on_commit=False)`.
      - `connect()` renvoie `self.SessionFactory()`.
      - `_query_with_relations(session)` regroupe les `joinedload` (city, detail) et les `selectinload` (powers, teams, missions).
      - Chaque méthode suit le même schéma : `session = self.connect()`, puis `try: return (...)`, puis `finally: session.close()`.
      - `findById` renvoie `[hero]` ou `[]`. `findByCity` fait `.join(Superhero.city).filter(City.name.ilike(f"%{x}%"))`.
      - On peut aussi requêter d'autres modèles : `session.query(Team).options(selectinload(Team.superheroes))`.
    example: |
      class SuperheroSqliteORM(SuperheroDAOInterface):
          def __init__(self, db_path=None, db_uri=None):
              if db_uri is not None:
                  self.db_uri = db_uri
              elif db_path is not None:
                  self.db_uri = f"sqlite:///{db_path}"
              self.engine = get_engine(self.db_uri)
              self.SessionFactory = sessionmaker(bind=self.engine, expire_on_commit=False)

          def connect(self):
              return self.SessionFactory()

          def findByCity(self, city_name):
              session = self.connect()
              try:
                  return (
                      self._query_with_relations(session)
                      .join(Superhero.city)
                      .filter(City.name.ilike(f"%{city_name}%"))
                      .order_by(Superhero.name)
                      .all()
                  )
              finally:
                  session.close()
    exercises:
      - type: trous
        tags: [dao-orm, session-orm]
        enonce: "Complète le constructeur du DAO."
        code: |
          self.engine = get_engine(self.db_uri)
          self.SessionFactory = [[0]](bind=[[1]], expire_on_commit=[[2]])
        blanks:
          - ["sessionmaker"]
          - ["self.engine"]
          - ["False"]
      - type: trous
        tags: [dao-orm, join, ilike]
        enonce: "Complète `findByTeam`."
        code: |
          def findByTeam(self, team_name):
              session = self.connect()
              try:
                  return (
                      self._query_with_relations(session)
                      .[[0]](Superhero.teams)
                      .filter(Team.name.[[1]](f"%{team_name}%"))
                      .all()
                  )
              [[2]]:
                  session.close()
        blanks:
          - ["join"]
          - ["ilike"]
          - ["finally"]
      - type: ordre
        tags: [dao-orm, try-finally]
        enonce: "Remets dans l'ordre `findById`."
        lines:
          - "def findById(self, id):"
          - "    session = self.connect()"
          - "    try:"
          - "        hero = self._query_with_relations(session).filter(Superhero.id == id).first()"
          - "        return [hero] if hero else []"
          - "    finally:"
          - "        session.close()"
      - type: ordre
        tags: [dao-orm, loading]
        enonce: "Remets dans l'ordre `findAllTeams` (les équipes avec leurs héros chargés)."
        lines:
          - "def findAllTeams(self):"
          - "    session = self.connect()"
          - "    try:"
          - "        return session.query(Team).options(selectinload(Team.superheroes)).order_by(Team.name).all()"
          - "    finally:"
          - "        session.close()"
      - type: relier
        tags: [dao-orm, query]
        enonce: "Relie chaque méthode du DAO à sa requête."
        pairs:
          - ["findByUniverse", "filter(Superhero.universe.ilike(universe))"]
          - ["findByPower", "join(Superhero.powers).filter(Power.name.ilike(...))"]
          - ["findById", "filter(Superhero.id == id).first()"]
          - ["findAll", "order_by(Superhero.name) puis limit(limit) si fourni"]
      - type: qcm
        tags: [dao-orm, session-orm]
        enonce: "Pourquoi `expire_on_commit=False` dans le DAO ?"
        choices: ["Pour que les objets restent lisibles après la fermeture de la session (dans le service et les templates)", "Pour désactiver les commits", "Pour accélérer les requêtes", "Pour garder la session ouverte en permanence"]
        answer: 0

  - id: "3.5"
    palier: 2
    title: "Le service : statistiques, distinct, count"
    memo: |
      - `SuperheroService.__init__(db_path=None, db_uri=None)` lit `current_app.config` si rien n'est fourni (dans un `try / except RuntimeError` hors requête), puis `self.hdao = SuperheroSqliteORM(...)`.
      - Le service **délègue** au DAO : `getHeroesByCity(city_name)` renvoie `self.hdao.findByCity(city_name)`.
      - `getUniverses()` : `session.query(Superhero.universe).distinct().order_by(Superhero.universe).all()`, puis `[u[0] for u in ... if u[0]]`.
      - `getStatsSummary()` renvoie un dictionnaire de `session.query(Modele).count()`.
      - `.count()` fait le comptage en SQL, alors que `len(query.all())` charge d'abord tous les objets.
      - Les calculs **par objet** vont dans le modèle (`@property average_danger`), les **agrégats globaux** dans le service.
    example: |
      def getStatsSummary(self):
          """statistiques globales pour le tableau de bord"""
          session = self.hdao.connect()
          try:
              return {
                  "total_heroes": session.query(Superhero).count(),
                  "total_teams": session.query(Team).count(),
                  "total_powers": session.query(Power).count(),
                  "total_missions": session.query(Mission).count(),
              }
          finally:
              session.close()
    exercises:
      - type: trous
        tags: [service-stats, distinct]
        enonce: "Complète `getUniverses()`."
        code: |
          universes = (
              session.query(Superhero.[[0]])
              .[[1]]()
              .order_by(Superhero.universe)
              .all()
          )
          return [u[0] for u in universes if u[0]]
        blanks:
          - ["universe"]
          - ["distinct"]
      - type: trous
        tags: [service-stats, count]
        enonce: "Complète le comptage des missions."
        code: |
          total_missions = session.[[0]](Mission).[[1]]()
        blanks:
          - ["query"]
          - ["count"]
      - type: qcm
        tags: [count]
        enonce: "Pourquoi préférer `session.query(Superhero).count()` à `len(session.query(Superhero).all())` ?"
        choices: ["`count()` compte en SQL sans charger tous les objets en mémoire", "`len` ne marche pas sur une liste", "`count()` trie les résultats", "Il n'y a aucune différence"]
        answer: 0
      - type: ordre
        tags: [service-stats, try-finally]
        enonce: "Remets dans l'ordre `getStatsSummary` (version courte)."
        lines:
          - "def getStatsSummary(self):"
          - "    session = self.hdao.connect()"
          - "    try:"
          - "        return {\"total_heroes\": session.query(Superhero).count(), \"total_teams\": session.query(Team).count()}"
          - "    finally:"
          - "        session.close()"
      - type: relier
        tags: [service-stats, property, mvcs]
        enonce: "Où placer chaque calcul ?"
        pairs:
          - ["Danger moyen des missions d'UN héros", "@property average_danger dans le modèle Superhero"]
          - ["Nombre total de héros en base", "getStatsSummary() dans le service"]
          - ["Requête des héros d'une ville", "findByCity() dans le DAO"]
          - ["Choix du filtre selon l'URL", "La route heroes() du blueprint"]
      - type: vf
        tags: [service]
        enonce: "`getHeroesByUniverse(universe)` dans le service peut simplement renvoyer `self.hdao.findByUniverse(universe)`."
        answer: true
        explication: "Vrai : le service délègue au DAO quand il n'y a pas de logique supplémentaire."

  - id: "3.6"
    palier: 2
    title: "Blueprints avec filtres par query params"
    memo: |
      - `heroes()` lit `universe`, `city`, `power` et `team` avec `request.args.get(...)`. Chacun vaut `None` s'il est absent.
      - Une cascade de `if / elif` choisit la méthode du service. Le premier filtre présent l'emporte (ici `universe`).
      - Sans filtre : `getAllHeroes()`. Le titre de la page change selon le filtre.
      - `current_filter={...}` est passé au template pour surligner le filtre actif.
      - Il existe aussi des routes dédiées : `/city/<string:city_name>`, `/power/<string:power_name>`, `/team/<string:team_name>`.
      - L'enregistrement se fait avec `app.register_blueprint(heroes_bp, url_prefix='/heroes')`.
    example: |
      @heroes_bp.route('/', methods=['GET'])
      def heroes():
          hs = SuperheroService(current_app.config['DATABASE_PATH'])
          universe = request.args.get('universe')
          city = request.args.get('city')
          if universe:
              heroes_data = hs.getHeroesByUniverse(universe)
              title = f"Héros de {universe}"
          elif city:
              heroes_data = hs.getHeroesByCity(city)
              title = f"Héros à {city}"
          else:
              heroes_data = hs.getAllHeroes()
              title = "Super-Héros"
          return render_template('heroes_view.html', metadata={"title": title}, heroes=heroes_data,
                                 current_filter={"universe": universe, "city": city})
    exercises:
      - type: trous
        tags: [filters, request-args]
        enonce: "Complète la lecture des filtres."
        code: |
          universe = request.[[0]].get([[1]])
          power = request.args.[[2]]('power')
        blanks:
          - ["args"]
          - ["'universe'"]
          - ["get"]
      - type: qcm
        tags: [filters]
        enonce: "Avec la cascade `if universe: … elif city: …`, que renvoie `/heroes/?universe=DC&city=Gotham` ?"
        choices: ["Les héros de DC (le filtre `universe` est testé en premier)", "Les héros de Gotham", "Les héros de DC **et** de Gotham", "Une erreur 400"]
        answer: 0
        explication: "Le TD03 le dit lui-même : on priorise clairement `universe`. Pour combiner les filtres, il faudrait une autre approche."
      - type: trous
        tags: [route-params, filters]
        enonce: "Complète la route dédiée aux pouvoirs."
        code: |
          @heroes_bp.route('/power/[[0]]', methods=['GET'])
          def heroes_by_power(power_name):
              heroes_data = SuperheroService().getHeroesByPower(power_name)
              return render_template('heroes_view.html', heroes=heroes_data, current_filter={"power": power_name})
        blanks: [["<string:power_name>", "<power_name>"]]
      - type: ordre
        tags: [filters, request-args]
        enonce: "Remets dans l'ordre cette version simplifiée de `heroes()`."
        lines:
          - "@heroes_bp.route('/', methods=['GET'])"
          - "def heroes():"
          - "    universe = request.args.get('universe')"
          - "    if universe:"
          - "        data = SuperheroService().getHeroesByUniverse(universe)"
