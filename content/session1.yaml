          def test_coltrane():
              """findByArtist('Coltrane') renvoie 3 objets Album"""
              res = AlbumSqliteDAO("albums.db").findByArtist("Coltrane") or []
              assert len(res) == 3, f"attendu 3 albums, obtenu {len(res)}"
              assert all(isinstance(a, Album) for a in res), "il faut des objets Album (Album.from_dict(dict(row)))"

          def test_partiel():
              """findByArtist('Miles') trouve 'Kind of Blue'"""
              res = AlbumSqliteDAO("albums.db").findByArtist("Miles") or []
              assert [a.title for a in res] == ["Kind of Blue"]

          def test_aucun():
              """findByArtist('Daft Punk') renvoie une liste vide"""
              assert AlbumSqliteDAO("albums.db").findByArtist("Daft Punk") == []

          def test_injection():
              """une saisie piégée ne renvoie rien (requête paramétrée)"""
              res = AlbumSqliteDAO("albums.db").findByArtist("' OR 1=1 --")
              assert res == [], "ta requête est injectable : utilise ? et un tuple de paramètres"
        solution: |
          class AlbumSqliteDAO(AlbumDAOInterface):
              def __init__(self, db_path=None):
                  self.db_path = db_path

              def connect(self):
                  conn = sqlite3.connect(self.db_path)
                  conn.row_factory = sqlite3.Row
                  return conn

              def findByArtist(self, name):
                  """albums dont l'artiste contient name, en objets Album"""
                  conn = self.connect()
                  cursor = conn.cursor()
                  cursor.execute("SELECT id, title, year, artist FROM albums WHERE artist LIKE ?", (f"%{name}%",))
                  rows = cursor.fetchall()
                  conn.close()
                  return [Album.from_dict(dict(row)) for row in rows]
        indices: ["Le `%` se met dans la **valeur** du paramètre, pas dans la requête : `(f\"%{name}%\",)`."]
