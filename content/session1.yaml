      - type: papier
        tags: [dao-sqlite3]
        enonce: "Écris le début de `AlbumSqliteDAO(AlbumDAOInterface)` : le constructeur (`db_path`), `connect()` et `findAll(limit=None)`, qui renvoie une liste de dictionnaires."
        duree: 420
        setup: |
          import sqlite3
          _c = sqlite3.connect("music.db")
          _c.executescript("""
          DROP TABLE IF EXISTS albums;
          CREATE TABLE albums (id INTEGER PRIMARY KEY AUTOINCREMENT, title TEXT NOT NULL, year INTEGER, artist TEXT);
          INSERT INTO albums (title, year, artist) VALUES ('Kind of Blue', 1959, 'Miles Davis');
          INSERT INTO albums (title, year, artist) VALUES ('A Love Supreme', 1965, 'John Coltrane');
          INSERT INTO albums (title, year, artist) VALUES ('Blue Train', 1957, 'John Coltrane');
          """)
          _c.commit()
          _c.close()
          class AlbumDAOInterface:
              pass
          fake_module("app.models.AlbumDAOInterface", AlbumDAOInterface=AlbumDAOInterface)
        tests: |
          def test_connect():
              """connect() utilise sqlite3.Row"""
              conn = AlbumSqliteDAO("music.db").connect()
              assert conn.row_factory is sqlite3.Row
              conn.close()

          def test_findAll():
              """findAll() renvoie 3 dictionnaires"""
              res = AlbumSqliteDAO("music.db").findAll()
              assert len(res) == 3 and isinstance(res[0], dict)

          def test_limit():
              """findAll(2) renvoie 2 albums"""
              assert len(AlbumSqliteDAO("music.db").findAll(2)) == 2
        grille:
          - {critere: "`class AlbumSqliteDAO(AlbumDAOInterface)` et `self.db_path = db_path`", points: 1}
          - {critere: "`connect()` : `sqlite3.connect(self.db_path)`, `row_factory = sqlite3.Row`, `return conn`", points: 1.5, auto: test_connect}
          - {critere: "`findAll` : `LIMIT ?` avec `(limit,)` si `limit` est donné", points: 1, auto: test_limit}
          - {critere: "`fetchall()`, `conn.close()`, `[dict(row) for row in rows]`", points: 1.5, auto: test_findAll}
        solution: |
          import sqlite3
          from app.models.AlbumDAOInterface import AlbumDAOInterface


          class AlbumSqliteDAO(AlbumDAOInterface):
              def __init__(self, db_path=None):
                  self.db_path = db_path

              def connect(self):
                  conn = sqlite3.connect(self.db_path)
                  conn.row_factory = sqlite3.Row
                  return conn

              def findAll(self, limit=None):
                  conn = self.connect()
                  cursor = conn.cursor()
                  if limit:
                      cursor.execute("SELECT id, title, year, artist FROM albums LIMIT ?", (limit,))
                  else:
                      cursor.execute("SELECT id, title, year, artist FROM albums")
                  rows = cursor.fetchall()
                  conn.close()
                  return [dict(row) for row in rows]
