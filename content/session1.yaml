        duree: 300
        setup: |
          class _DAO:
              def __init__(self, db_path=None):
                  pass
              def findById(self, id):
                  return {"id": 1, "name": "Lina", "classe": "BUT3-A"} if id == 1 else None
              def findGrades(self, id):
                  return [{"value": 12}, {"value": 15}, {"value": 14}] if id == 1 else []
          fake_module("app.models.StudentDAO", StudentSqliteDAO=_DAO)
        tests: |
