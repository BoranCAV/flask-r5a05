        tags: [dao-sqlite3, sql-injection]
        enonce: "Écris `findById(id)` et `findByYear(year)`, avec des requêtes paramétrées et le retour en liste de dictionnaires. Recopie la classe avec `connect()`."
        duree: 360
        setup: |
          import sqlite3
          _c = sqlite3.connect("music.db")
          _c.executescript("""
          DROP TABLE IF EXISTS albums;
          CREATE TABLE albums (id INTEGER PRIMARY KEY AUTOINCREMENT, title TEXT NOT NULL, year INTEGER, artist TEXT);
          INSERT INTO albums (title, year, artist) VALUES ('Kind of Blue', 1959, 'Miles Davis');
          INSERT INTO albums (title, year, artist) VALUES ('A Love Supreme', 1965, 'John Coltrane');
          INSERT INTO albums (title, year, artist) VALUES ('Giant Steps', 1959, 'John Coltrane');
          """)
          _c.commit()
          _c.close()
          class AlbumDAOInterface:
              pass
          fake_module("app.models.AlbumDAOInterface", AlbumDAOInterface=AlbumDAOInterface)
        tests: |
          def test_by_id():
              """findById(2) renvoie [A Love Supreme]"""
              res = AlbumSqliteDAO("music.db").findById(2)
              assert len(res) == 1 and res[0]["title"] == "A Love Supreme"

          def test_by_year():
              """findByYear(1959) renvoie 2 albums"""
              assert len(AlbumSqliteDAO("music.db").findByYear(1959)) == 2

          def test_parametre():
              """la requête est paramétrée (pas d'injection)"""
              assert AlbumSqliteDAO("music.db").findById("1 OR 1=1") == []
        grille:
          - {critere: "`WHERE id = ?` avec `(id,)`", points: 1.5, auto: test_by_id}
          - {critere: "`WHERE year = ?` avec `(year,)`", points: 1.5, auto: test_by_year}
          - {critere: "Aucune f-string dans le SQL", points: 1, auto: test_parametre}
          - {critere: "Connexion fermée avant le `return`", points: 1}
        solution: |
          import sqlite3
          from app.models.AlbumDAOInterface import AlbumDAOInterface


          class AlbumSqliteDAO(AlbumDAOInterface):
              def __init__(self, db_path=None):
                  self.db_path = db_path

              def connect(self):
                  conn = sqlite3.connect(self.db_path)
                  conn.row_factory = sqlite3.Row
                  return conn

              def findById(self, id):
                  conn = self.connect()
                  cursor = conn.cursor()
                  cursor.execute("SELECT id, title, year, artist FROM albums WHERE id = ?", (id,))
                  rows = cursor.fetchall()
                  conn.close()
                  return [dict(row) for row in rows]

              def findByYear(self, year):
                  conn = self.connect()
                  cursor = conn.cursor()
                  cursor.execute("SELECT id, title, year, artist FROM albums WHERE year = ?", (year,))
                  rows = cursor.fetchall()
                  conn.close()
                  return [dict(row) for row in rows]
      - type: papier
        tags: [dao-interface, mvcs, sql-injection]
        enonce: "Question de cours : pourquoi définir une interface `AlbumDAOInterface` ? Et pourquoi les requêtes paramétrées ? (5 lignes maximum)"
        duree: 240
        grille:
          - {critere: "L'interface fixe les méthodes que toute implémentation doit fournir", points: 1}
          - {critere: "On peut changer d'implémentation (sqlite3 → ORM) sans modifier le service", points: 1}
          - {critere: "Le service dépend de l'abstraction, pas du stockage (logique métier isolée)", points: 1}
          - {critere: "Les requêtes paramétrées évitent l'injection SQL (le pilote échappe les valeurs)", points: 1}
        solution: |
          L'interface définit le contrat (les méthodes connect, findAll, findById, findByYear) que tout DAO
          doit respecter. Le service ne dépend que de ce contrat : on peut remplacer AlbumSqliteDAO par
          AlbumSqliteORM (TD02) sans toucher au service ni aux blueprints.
          Les requêtes paramétrées (?, tuple de valeurs) laissent le pilote échapper les valeurs :
          une saisie malveillante ne peut pas modifier la requête (pas d'injection SQL).

