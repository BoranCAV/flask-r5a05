  - id: "1.8"
    palier: 3
    title: "DAO sqlite3 avec interface (domaine : musique)"
    memo: |
      - L'**interface** liste les méthodes (corps `pass` + docstring) : `connect`, `findAll(limit)`, `findById(id)`, `findByYear(year)`.
      - L'implémentation hérite de l'interface : `class MovieSqliteDAO(MovieDAOInterface)`.
      - `connect()` : `conn = sqlite3.connect(self.db_path)` puis `conn.row_factory = sqlite3.Row` (accès aux colonnes par leur nom).
      - Toujours des requêtes **paramétrées** : `cursor.execute("... WHERE year = ?", (year,))`. Jamais de f-string (risque d'injection SQL). Attention à la virgule du tuple `(year,)`.
      - `rows = cursor.fetchall()`, puis `conn.close()`, puis conversion avec `[dict(row) for row in rows]`.
      - Le service ne connaît que l'interface : on passera à l'ORM (`MovieSqliteORM`) sans le modifier.
    example: |
      import sqlite3
      from app.models.MovieDAOInterface import MovieDAOInterface

      class MovieSqliteDAO(MovieDAOInterface):
          def __init__(self, db_path=None):
              self.db_path = db_path

          def connect(self):
              conn = sqlite3.connect(self.db_path)
              conn.row_factory = sqlite3.Row          # row['title'] possible
              return conn

          def findByYear(self, year):
              conn = self.connect()
              cursor = conn.cursor()
              cursor.execute("SELECT id, title, year FROM movies WHERE year = ?", (year,))
              rows = cursor.fetchall()
              conn.close()
              return [dict(row) for row in rows]
