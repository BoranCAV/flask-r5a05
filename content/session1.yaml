              """getStudentById(1) renvoie [Lina] et getStudentById(9) renvoie []"""
              s = StudentService("s.db")
              assert s.getStudentById(1) == [{"id": 1, "name": "Lina", "classe": "BUT3-A"}]
              assert s.getStudentById(9) == []

          def test_average():
              """getAverage(1) == 13.7 et getAverage(9) is None"""
              s = StudentService("s.db")
              assert s.getAverage(1) == 13.7 and s.getAverage(9) is None
        grille:
          - {critere: "`getStudentById` renvoie `[res]` ou `[]` (jamais `[None]`)", points: 1.5, auto: test_by_id}
          - {critere: "`getAverage` : garde-fou `if not grades: return None`", points: 1, auto: test_average}
          - {critere: "`round(sum(...) / len(grades), 1)`", points: 1, auto: test_average}
          - {critere: "Annotations `List[Dict]` et `Optional[float]`", points: 0.5}
        solution: |
          from typing import List, Dict, Optional
          from flask import current_app
          from app.models.StudentDAO import StudentSqliteDAO


          class StudentService:
              def __init__(self, db_path=None):
                  if db_path is None:
                      db_path = current_app.config['DATABASE_PATH']
                  self.sdao = StudentSqliteDAO(db_path)

              def getStudentById(self, id: int) -> List[Dict]:
                  res = self.sdao.findById(id)
                  return [res] if res else []

              def getAverage(self, id: int) -> Optional[float]:
                  grades = self.sdao.findGrades(id)
                  if not grades:
                      return None
                  return round(sum(g["value"] for g in grades) / len(grades), 1)
