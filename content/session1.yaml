session:
  id: 1
  title: "Flask modulaire"
  subtitle: "MVC-S, packages, application factory, blueprints, routes, modèle, DAO sqlite3 et service typé."

lessons:
  # ===================================================================== PALIER 1
  - id: "1.1"
    palier: 1
    title: "MVC-S : qui fait quoi ?"
    memo: |
      - **Model** : représente les données (classe `Movie`), sans aucun traitement.
      - **DAO** (Data Access Object) : centralise l'accès à la base (SQL ou ORM) et convertit les lignes en objets.
      - **Service** : la logique métier (ex. `getMoviesYears`). Il est appelé par les contrôleurs et ne dépend pas du type de stockage, d'où l'usage de types.
      - **Controller** : les routes. En Flask modulaire, ce sont les **blueprints** : plus de dossier `controllers`.
      - **View** : les templates Jinja (présentation).
      - Flux d'une requête : blueprint → service → DAO → base, puis retour vers la vue.
      - L'**interface** du DAO (`MovieDAOInterface`) fixe les méthodes : on peut changer d'implémentation (sqlite3 → ORM) sans toucher au service.
    example: |
      # blueprint (contrôleur) : reçoit la requête, appelle le service, renvoie la vue
      @movies_bp.route('/year', methods=['GET'])
      def moviesByYear():
          ms = MovieService()                       # service : logique métier
          year = int(request.args.get('myear'))     # entrée lue dans l'URL
          movies = ms.getMoviesByYear(year)         # le service appelle le DAO
          return render_template('movies_view.html', movies=movies)  # vue
    exercises:
      - type: qcm
        tags: [mvcs, service]
        enonce: "Dans quelle couche place-t-on la méthode `getMoviesYears()` qui calcule la liste triée des années disponibles ?"
        choices: ["Model", "DAO", "Service", "Blueprint (contrôleur)"]
        answer: 2
        indices: ["C'est de la logique métier : un calcul à partir des données, pas un accès direct à la base."]
        explication: "Le service contient la logique métier. Il demande les films au DAO puis calcule les années distinctes. Le DAO, lui, ne fait que lire la base."
      - type: qcm
        tags: [mvcs, dao]
        enonce: "Où écrit-on la requête `SELECT id, title FROM movies WHERE year = ?` ?"
        choices: ["Dans le blueprint", "Dans le DAO", "Dans le service", "Dans le template"]
        answer: 1
        explication: "Le DAO est le seul composant qui parle à la base : il isole le stockage du reste de l'application."
      - type: vf
        tags: [mvcs, service]
        enonce: "Le service doit savoir si les données viennent de SQLite, d'un fichier JSON ou d'un ORM."
        answer: false
        explication: "Faux : le service ne dépend pas du type de données. Il passe par le DAO, et l'interface du DAO masque le stockage."
      - type: vf
        tags: [mvcs, blueprint]
        enonce: "Dans l'architecture du cours, les blueprints remplacent le dossier `controllers`."
        answer: true
        explication: "Vrai : chaque blueprint porte ses propres routes (`@bp.route`). Ce sont les contrôleurs de l'application modulaire."
      - type: relier
        tags: [mvcs]
        enonce: "Relie chaque couche à son rôle."
        pairs:
          - ["Model", "Représente les données manipulées, sans traitement"]
          - ["DAO", "Lit et écrit dans la base, convertit les lignes en objets"]
          - ["Service", "Contient la logique métier et orchestre les DAO"]
          - ["Blueprint", "Reçoit la requête HTTP et choisit la réponse"]
          - ["Template Jinja", "Met en forme la réponse HTML"]
        explication: "C'est le découpage MVC-S du cours : Model, (DAO), Service, Controller, View."
      - type: ordre
        tags: [mvcs]
        enonce: "Remets dans l'ordre le trajet d'une requête `GET /movies/year?myear=1999`."
        lines:
          - "Le navigateur envoie la requête GET"
          - "Le blueprint movies lit request.args.get('myear')"
          - "Le service MovieService applique la logique métier"
          - "Le DAO interroge la base de données"
          - "Le blueprint renvoie render_template(...) avec les films"
        explication: "Requête → contrôleur (blueprint) → service → DAO → base, puis la réponse remonte jusqu'à la vue."
      - type: trous
        tags: [dao-interface, mvcs]
        enonce: "Complète la déclaration du DAO sqlite3, qui implémente l'interface du cours."
        code: |
          class MovieSqliteDAO([[0]]):
              """DAO des films (sqlite3)"""
        blanks: [["MovieDAOInterface"]]
        indices: ["Le nom de l'interface est celui du fichier `MovieDAOInterface.py`."]
        explication: "La classe concrète hérite de l'interface : elle doit fournir `connect`, `findAll`, `findById`, `findByYear`…"

  - id: "1.2"
    palier: 1
    title: "Modules, packages et __init__.py"
    memo: |
      - **Module** : un fichier `.py`. Par exemple `base.py`, qui contient `Base`, `BaseModelMixin` et `get_engine()`.
      - **Package** : un dossier qui contient un fichier `__init__.py` (ex. `app/`, `app/blueprints/`).
      - `__init__.py` s'exécute à l'import du package. On s'en sert pour réexporter : `from .routes import index_bp`.
      - `__all__ = ['index_bp']` liste les noms publics, ceux qu'importe `from package import *`.
      - Arborescence du cours : `app/blueprints/`, `app/models/`, `app/services/`, `app/static/`, `app/templates/`, avec `main.py` à la racine.
      - Un blueprint est un sous-package : `blueprints/movies/__init__.py`, `routes.py`, `templates/`.
      - `blueprints/__init__.py` réexporte tous les blueprints pour la factory.
    example: |
      # arborescence du TD01
      # TD01/
      # ├── main.py                 → create_app() + app.run(port=8000)
      # └── app/                    → package principal
      #     ├── __init__.py         → def create_app()
      #     ├── blueprints/
      #     │   ├── __init__.py     → réexporte index_bp, movies_bp…
      #     │   └── movies/
      #     │       ├── __init__.py → from .routes import movies_bp
      #     │       ├── routes.py   → movies_bp = Blueprint(...)
      #     │       └── templates/movies_view.html
      #     ├── models/             → Movie.py, MovieDAO.py, MovieDAOInterface.py
      #     └── services/           → MovieService.py

      # app/blueprints/movies/__init__.py
      from .routes import movies_bp

      __all__ = ['movies_bp']
    exercises:
      - type: qcm
        tags: [module-package]
        enonce: "Qu'est-ce qui fait d'un dossier un **package** Python ?"
        choices: ["La présence d'un fichier `__init__.py`", "La variable `__all__`", "Un fichier `main.py`", "Un fichier `routes.py`"]
        answer: 0
        explication: "Un package est un dossier avec un `__init__.py`. Ce fichier est exécuté à l'import et peut contrôler ce que le package expose."
      - type: vf
        tags: [module-package]
        enonce: "Le fichier `base.py`, qui contient une classe, une variable globale `Base` et une fonction `get_engine()`, est un module."
        answer: true
        explication: "Vrai : un module est un simple fichier `.py`, qui peut contenir des classes, des variables et des fonctions."
      - type: qcm
        tags: [init-all]
        enonce: "À quoi sert `__all__ = ['index_bp']` dans un `__init__.py` ?"
        choices:
          - "À lister les noms exportés par `from package import *`"
          - "À enregistrer le blueprint dans l'application"
          - "À rendre `index_bp` privé"
          - "À créer le dossier templates"
        answer: 0
        explication: "`__all__` définit l'interface publique du module ou du package. L'enregistrement, lui, se fait avec `app.register_blueprint`."
      - type: trous
        tags: [init-all, blueprint]
        enonce: "Complète `app/blueprints/movies/__init__.py`."
        code: |
          from [[0]] import movies_bp

          __all__ = [[[1]]]
        blanks:
          - [".routes", "app.blueprints.movies.routes"]
          - ["'movies_bp'"]
        indices: ["L'import est relatif au package courant : le point désigne le dossier `movies/`."]
        explication: "Le `__init__.py` du blueprint importe l'objet depuis `routes.py` et l'exporte via `__all__`, sous forme de chaîne."
      - type: relier
        tags: [arborescence]
        enonce: "Relie chaque fichier à son rôle."
        pairs:
          - ["main.py", "Crée l'application et la lance sur le port 8000"]
          - ["app/__init__.py", "Contient la fonction create_app()"]
          - ["app/blueprints/__init__.py", "Réexporte tous les blueprints"]
          - ["app/blueprints/movies/routes.py", "Déclare movies_bp et ses routes"]
          - ["app/models/Movie.py", "Classe représentant un film"]
      - type: qcm
        tags: [module-package]
        enonce: "Lesquels sont des **packages** (on suppose que chaque dossier contient un `__init__.py`) ?"
        choices: ["`app/`", "`app/models/`", "`app/models/base.py`", "`main.py`"]
        answer: [0, 1]
        explication: "Les dossiers avec `__init__.py` sont des packages. Les fichiers `.py` sont des modules."
      - type: bug
        tags: [init-all]
        enonce: "Ce `app/blueprints/__init__.py` contient une erreur. Trouve-la et corrige-la."
        code: |
          from app.blueprints.index import index_bp
          from app.blueprints.movies import movies_bp

          __all__ = [
              'index_bp',
              movies_bp,
          ]
        fixes:
          6: ["'movies_bp',"]
        explication: "`__all__` contient des **noms** (chaînes de caractères), pas les objets eux-mêmes."

  - id: "1.3"
    palier: 1
    title: "L'application factory"
    memo: |
      - `create_app()`, dans `app/__init__.py`, crée l'application, la configure et la retourne : c'est l'**application factory**.
      - `app = Flask(__name__, static_url_path='/static')`
      - Configuration : `app.config['DATABASE_PATH'] = os.path.join(app.root_path, 'movies.db')`, `app.secret_key = '...'`.
      - Les blueprints sont importés **dans** la fonction puis enregistrés (`app.register_blueprint(index_bp)`). Ça évite les imports circulaires.
      - `main.py` : `app = create_app()` puis `app.run(host="localhost", port=8000, debug=True)` sous `if __name__ == '__main__':`.
      - Avant, avec un module unique : `app = Flask(__name__)` dans le contexte global et `@app.route` partout.
    example: |
      import os
      from flask import Flask


      def create_app():
          """application factory : crée, configure et retourne l'app"""
          app = Flask(__name__, static_url_path='/static')
          # configuration de la base de données
          app.config['DATABASE_PATH'] = os.path.join(app.root_path, 'movies.db')
          app.secret_key = 'ma cle secrete unique'

          # import DANS la fonction pour éviter les imports circulaires
          from app.blueprints import index_bp, movies_bp
          app.register_blueprint(index_bp)
          app.register_blueprint(movies_bp, url_prefix='/movies')
          return app
    exercises:
      - type: qcm
        tags: [factory, arborescence]
        enonce: "Dans quel fichier le cours définit-il `create_app()` ?"
        choices: ["`main.py`", "`app/__init__.py`", "`app/blueprints/__init__.py`", "`app/services/__init__.py`"]
        answer: 1
        explication: "La factory est dans `app/__init__.py`, ce qui permet `from app import create_app` dans `main.py`."
      - type: qcm
        tags: [factory]
        enonce: "Pourquoi importe-t-on les blueprints **à l'intérieur** de `create_app()` ?"
        choices:
          - "Pour éviter les imports circulaires entre `app` et les blueprints"
          - "Parce que Python interdit les imports en haut de fichier"
          - "Pour que Jinja trouve les templates"
          - "Pour accélérer les requêtes"
        answer: 0
        explication: "Les blueprints importent des services, qui peuvent importer `app`. Importer dans la fonction retarde l'import jusqu'à l'appel de la factory."
      - type: trous
        tags: [main, factory]
        enonce: "Complète `main.py`."
        code: |
          from app import [[0]]

          app = create_app()

          if __name__ == [[1]]:
              app.run(host="localhost", port=[[2]], debug=True)
        blanks:
          - ["create_app"]
          - ["'__main__'"]
          - ["8000"]
        explication: "`main.py` importe la factory, crée l'app, puis la lance seulement si le fichier est exécuté directement."
      - type: ordre
        tags: [factory]
        enonce: "Remets dans l'ordre la factory minimale du cours."
        lines:
          - "def create_app():"
          - "    app = Flask(__name__, static_url_path='/static')"
          - "    app.config['DATABASE_PATH'] = os.path.join(app.root_path, 'movies.db')"
          - "    from app.blueprints import movies_bp"
          - "    app.register_blueprint(movies_bp, url_prefix='/movies')"
          - "    return app"
        explication: "On crée l'app, on la configure, on importe puis on enregistre les blueprints, et on la retourne."
      - type: vf
        tags: [factory]
        enonce: "`create_app()` doit se terminer par `return app`."
        answer: true
        explication: "Vrai : sans `return app`, `main.py` récupérerait `None`."
      - type: qcm
        tags: [factory, config]
        enonce: "Que vaut `app.root_path` quand l'app est créée dans `app/__init__.py` avec `Flask(__name__)` ?"
        choices: ["Le dossier du package `app/`", "Le dossier où se trouve `main.py`", "Le dossier `static/`", "Le dossier personnel de l'utilisateur"]
        answer: 0
        explication: "`root_path` est le dossier du module passé à `Flask(__name__)`, ici `app/`. D'où `os.path.join(app.root_path, 'movies.db')` → `app/movies.db`."

  # ===================================================================== PALIER 2
  - id: "1.4"
    palier: 2
    title: "Créer et enregistrer un blueprint"
    memo: |
      - `movies_bp = Blueprint('movies', __name__, template_folder='templates')`, dans `blueprints/movies/routes.py`.
      - 1er argument : le nom interne du blueprint, utilisé par `url_for('movies.movies')`. 2e argument : `__name__` (le module courant).
      - Les routes se déclarent sur le blueprint (`@movies_bp.route('/')`), plus sur `app`.
      - Enregistrement dans la factory : `app.register_blueprint(movies_bp, url_prefix='/movies')`.
      - `url_prefix` peut aussi se donner à `Blueprint(...)`. S'il est donné aux deux endroits, celui de `register_blueprint` l'emporte.
      - URL finale = préfixe + chemin de la route : `/movies` + `/year` → `/movies/year`.
      - `template_folder='templates'` : le blueprint a ses propres templates.
      - Sans `register_blueprint`, ses routes n'existent pas (erreur 404).
    example: |
      # app/blueprints/movies/routes.py
      from flask import Blueprint, render_template
      from app.services.MovieService import MovieService

      movies_bp = Blueprint('movies', __name__, template_folder="templates")


      @movies_bp.route('/', methods=['GET'])     # → /movies/ une fois enregistré
      def movies():
          ms = MovieService()
          return render_template('movies_view.html', movies=ms.getAllMovies())

      # dans create_app() :
      # app.register_blueprint(movies_bp, url_prefix='/movies')
    exercises:
      - type: trous
        tags: [blueprint, template-folder]
        enonce: "Complète la création du blueprint `movies` et de sa première route."
        code: |
          movies_bp = [[0]]('movies', [[1]], template_folder=[[2]])


          @[[3]].route('/', methods=['GET'])
          def movies():
              return "liste des films"
        blanks:
          - ["Blueprint"]
          - ["__name__"]
          - ["'templates'"]
          - ["movies_bp"]
        explication: "On instancie `Blueprint(nom, __name__, ...)` puis on décore les fonctions avec `@movies_bp.route`."
      - type: trous
        tags: [register-bp, url-prefix]
        enonce: "Complète l'enregistrement dans `create_app()` pour que les routes soient servies sous `/movies`."
        code: |
          from app.blueprints import movies_bp
          app.[[0]](movies_bp, [[1]]='/movies')
        blanks:
          - ["register_blueprint"]
          - ["url_prefix"]
      - type: qcm
        tags: [url-prefix, route-params]
        enonce: "La route `@movies_bp.route('/year')` appartient à un blueprint enregistré avec `url_prefix='/movies'`. Quelle URL l'atteint ?"
        choices: ["`/movies/year`", "`/year`", "`/movies_bp/year`", "`/year/movies`"]
        answer: 0
        explication: "L'URL finale combine le préfixe du blueprint et le chemin de la route."
      - type: ordre
        tags: [blueprint, register-bp, init-all]
        enonce: "Remets dans l'ordre les étapes pour ajouter un blueprint `infos` à l'application."
        lines:
          - "Créer le dossier app/blueprints/infos/"
          - "Écrire infos_bp = Blueprint('infos', __name__) dans infos/routes.py"
          - "Déclarer @infos_bp.route('/') et sa fonction"
          - "Exporter infos_bp dans infos/__init__.py avec __all__"
          - "Réexporter infos_bp dans app/blueprints/__init__.py"
          - "Appeler app.register_blueprint(infos_bp, url_prefix='/infos') dans create_app()"
      - type: ordre
        tags: [blueprint]
        enonce: "Remets dans l'ordre le fichier `infos/routes.py`."
        lines:
          - "from flask import Blueprint, render_template"
          - "infos_bp = Blueprint('infos', __name__, template_folder='templates')"
          - "@infos_bp.route('/', methods=['GET'])"
          - "def infos():"
          - "    return render_template('infos.html', data={'firstname': 'gaël'})"
      - type: relier
        tags: [blueprint, url-prefix, template-folder]
        enonce: "Relie chaque élément de `Blueprint('movies', __name__, url_prefix='/movies', template_folder='templates')` à son rôle."
        pairs:
          - ["'movies'", "Nom interne, utilisé dans url_for('movies.…')"]
          - ["__name__", "Module dans lequel le blueprint est défini"]
          - ["url_prefix", "Préfixe ajouté devant toutes les routes du blueprint"]
          - ["template_folder", "Dossier des templates propres au blueprint"]
      - type: qcm
        tags: [register-bp]
        enonce: "On a créé `movies_bp` et ses routes, mais on a oublié `app.register_blueprint(movies_bp)`. Que se passe-t-il sur `/movies/` ?"
        choices: ["Erreur 404 : la route n'existe pas", "Erreur 500", "La page s'affiche quand même", "Flask enregistre le blueprint automatiquement"]
        answer: 0
        explication: "Un blueprint n'est rattaché à l'application qu'au moment de `register_blueprint`. Avant ça, ses routes n'existent pas."

  - id: "1.5"
    palier: 2
    title: "Routes, méthodes et paramètres"
    memo: |
      - `@bp.route('/', methods=['GET'])` : par défaut, seule la méthode GET est acceptée. On ajoute `'POST'` pour un formulaire.
      - Convertisseurs : `<int:movie_id>` (entier), `<string:city_name>` (texte, le défaut). La valeur arrive en paramètre de la fonction.
      - Query string `?myear=1999` → `request.args.get('myear')`, qui renvoie `None` si le paramètre est absent. C'est toujours une **chaîne** : on convertit avec `int(...)`.
      - Formulaire POST → `request.form['index']` (KeyError si absent) ou `request.form.get('index')`.
      - `from flask import request`. `request.method` vaut `'GET'` ou `'POST'`.
      - Une même fonction peut avoir plusieurs décorateurs `@bp.route`.
    example: |
      @movies_bp.route('/<int:movie_id>', methods=['GET'])
      def movieView(movie_id):                     # movie_id est déjà un int
          movie_data = MovieService().getMovieById(movie_id)
          return render_template('movies_view.html', movies=movie_data)


      @movies_bp.route('/year', methods=['GET'])
      def moviesByYear():                          # /movies/year?myear=1999
          year = int(request.args.get('myear'))    # chaîne → int
          return render_template('movies_view.html', movies=MovieService().getMoviesByYear(year))


      @movies_bp.route('/', methods=['POST'])
      def movieByIndex():                          # formulaire avec un champ "index"
          movie_id = int(request.form['index'])
          return render_template('movies_view.html', movies=MovieService().getMovieById(movie_id))
    exercises:
      - type: trous
        tags: [route-params]
        enonce: "Complète la route pour que `/movies/42` appelle `movieView(42)` avec un entier."
        code: |
          @movies_bp.route('/[[0]]', methods=['GET'])
          def movieView(movie_id):
              return MovieService().getMovieById(movie_id)
        blanks: [["<int:movie_id>"]]
        indices: ["Syntaxe : `<convertisseur:nom_du_paramètre>`."]
      - type: trous
        tags: [request-args]
        enonce: "Complète la lecture du paramètre `myear` de l'URL `/movies/year?myear=1999`."
        code: |
          @movies_bp.route('/year', methods=['GET'])
          def moviesByYear():
              year = [[0]](request.[[1]].get('myear'))
              return render_template('movies_view.html', movies=MovieService().getMoviesByYear(year))
        blanks:
          - ["int"]
          - ["args"]
        explication: "`request.args` contient la query string. Ses valeurs sont des chaînes, d'où `int(...)`."
      - type: qcm
        tags: [request-args]
        enonce: "Pour l'URL `/movies/year?myear=1999`, que renvoie `request.args.get('myear')` ?"
        choices: ["`'1999'` (une chaîne)", "`1999` (un entier)", "`None`", "`['1999']`"]
        answer: 0
        explication: "Les paramètres d'URL arrivent toujours sous forme de chaînes. `get` renverrait `None` si `myear` était absent."
      - type: ordre
        tags: [request-form, route-methods]
        enonce: "Remets dans l'ordre la route qui reçoit un formulaire POST avec un champ `index`."
        lines:
          - "@movies_bp.route('/', methods=['POST'])"
          - "def movieByIndex():"
          - "    movie_id = int(request.form['index'])"
          - "    movie_data = MovieService().getMovieById(movie_id)"
          - "    return render_template('movies_view.html', movies=movie_data)"
      - type: ordre
        tags: [route-params, jsonify]
        enonce: "Remets dans l'ordre ce petit fichier d'API JSON."
        lines:
          - "from flask import Blueprint, jsonify"
          - "api_bp = Blueprint('api', __name__)"
          - "@api_bp.route('/movies/<int:movie_id>', methods=['GET'])"
          - "def movie_json(movie_id):"
          - "    movie = MovieService().getMovieById(movie_id)"
          - "    return jsonify(movie[0].to_dict())"
      - type: relier
        tags: [route-params, request-args, request-form, route-methods]
        enonce: "Relie chaque syntaxe à l'endroit d'où vient la donnée."
        pairs:
          - ["<int:movie_id>", "Un morceau du chemin de l'URL, converti en entier"]
          - ["request.args", "Les paramètres après le ? dans l'URL"]
          - ["request.form", "Les champs d'un formulaire envoyé en POST"]
          - ["methods=['GET', 'POST']", "Les méthodes HTTP acceptées par la route"]
      - type: vf
        tags: [route-methods]
        enonce: "Sans l'argument `methods=...`, une route accepte à la fois GET et POST."
        answer: false
        explication: "Faux : par défaut, une route n'accepte que GET (et HEAD). Un POST renverrait 405 Method Not Allowed."

  - id: "1.6"
    palier: 2
    title: "Réponses et contexte : render_template, jsonify, url_for, redirect, current_app"
    memo: |
      - `render_template('movies_view.html', movies=movies)` : rend une vue Jinja avec des variables.
      - `jsonify({...})` : renvoie une réponse JSON. Avec un modèle : `jsonify(movie.to_dict())`.
      - `url_for('movies.moviesByYear', myear=1999)` construit une URL à partir du **nom du blueprint + nom de la fonction**. Les arguments inconnus deviennent des query params : `/movies/year?myear=1999`.
      - `redirect(url_for('index.index'))` : redirection (code 302).
      - `current_app` : l'application courante, utilisable dans un service ou un blueprint sans importer `app`. Exemple : `current_app.config['DATABASE_PATH']`.
      - `current_app` n'existe que pendant une requête, ou dans un bloc `with app.app_context():`.
    example: |
      from flask import Blueprint, jsonify, redirect, url_for, request, current_app

      @api_bp.route('/movies/<int:movie_id>')
      def movie_json(movie_id):
          movie = MovieService().getMovieById(movie_id)
          return jsonify(movie[0].to_dict())             # réponse JSON

      @movies_bp.route('/search', methods=['POST'])
      def search():
          year = request.form['year']
          # 302 vers /movies/year?myear=...
          return redirect(url_for('movies.moviesByYear', myear=year))

      class MovieService:
          def __init__(self, db_path=None):
              if db_path is None:
                  db_path = current_app.config['DATABASE_PATH']   # config de l'app courante
              self.mdao = MovieSqliteDAO(db_path)
