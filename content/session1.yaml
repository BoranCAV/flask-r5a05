              """logique métier des élèves ; le DAO est injecté"""

              def __init__(self, dao):
                  self.sdao = dao

              def getClasses(self) -> List[str]:
                  return sorted(set(s["classe"] for s in self.sdao.findAll()))

              def getStudentsByClasse(self, classe: str) -> List[Dict]:
