              assert StudentService(FakeDAO()).getAverage(4) is None

          def test_meilleur():
              """getBestStudent('A') vaut 'Hugo'"""
              res = StudentService(FakeDAO()).getBestStudent("A")
              assert res == "Hugo", f"obtenu {res!r}"

          def test_meilleur_autre_classe():
              """getBestStudent('B') vaut 'Sami'"""
              assert StudentService(FakeDAO()).getBestStudent("B") == "Sami"

          def test_meilleur_aucun():
              """getBestStudent('Z') vaut None"""
              assert StudentService(FakeDAO()).getBestStudent("Z") is None
        solution: |
          from typing import Optional


          class StudentService:
              def __init__(self, dao):
                  self.sdao = dao

              def getAverage(self, student_id: int) -> Optional[float]:
                  grades = self.sdao.findGrades(student_id)
                  if not grades:
                      return None
                  return round(sum(g["value"] for g in grades) / len(grades), 1)

              def getBestStudent(self, classe: str) -> Optional[str]:
                  best_name, best_avg = None, None
                  for s in self.sdao.findAll():
                      if s["classe"] != classe:
                          continue
                      avg = self.getAverage(s["id"])
                      if avg is not None and (best_avg is None or avg > best_avg):
                          best_name, best_avg = s["name"], avg
                  return best_name
        indices: ["Réutilise `self.getAverage(...)` dans `getBestStudent`."]

