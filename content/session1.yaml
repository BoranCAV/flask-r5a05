          import sqlite3


          class AlbumSqliteDAO(AlbumDAOInterface):
              """DAO des albums (sqlite3)"""

              def __init__(self, db_path=None):
                  self.db_path = db_path

              def connect(self):
                  conn = sqlite3.connect(self.db_path)
                  conn.row_factory = sqlite3.Row
                  return conn

              def findAll(self, limit=None):
                  conn = self.connect()
                  cursor = conn.cursor()
                  if limit:
                      cursor.execute("SELECT id, title, year, artist FROM albums LIMIT ?", (limit,))
                  else:
                      cursor.execute("SELECT id, title, year, artist FROM albums")
                  rows = cursor.fetchall()
                  conn.close()
                  return [dict(row) for row in rows]

              def findById(self, id):
                  conn = self.connect()
                  cursor = conn.cursor()
                  cursor.execute("SELECT id, title, year, artist FROM albums WHERE id = ?", (id,))
                  rows = cursor.fetchall()
                  conn.close()
                  return [dict(row) for row in rows]

              def findByYear(self, year):
                  conn = self.connect()
                  cursor = conn.cursor()
                  cursor.execute("SELECT id, title, year, artist FROM albums WHERE year = ?", (year,))
                  rows = cursor.fetchall()
                  conn.close()
                  return [dict(row) for row in rows]
        indices:
          - "Pour `limit`, deux requêtes : avec `LIMIT ?` si `limit` est fourni, sans sinon."
          - "Chaque méthode suit le même schéma : connect → cursor → execute → fetchall → close → `[dict(row) for row in rows]`."
        explication: "C'est le `MovieSqliteDAO` du TD01, transposé aux albums."
