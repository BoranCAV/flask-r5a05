  - id: "1.9"
    palier: 3
    title: "Le service typé (domaine : école)"
    memo: |
      - Le service contient la logique métier et appelle le DAO. C'est le blueprint qui l'instancie.
      - Constructeur : `self.mdao = MovieSqliteDAO(db_path)`, avec `db_path = current_app.config['DATABASE_PATH']` s'il n'est pas fourni.
      - Typage : `from typing import List, Dict, Optional`, puis `def getAllMovies(self, limit: int = 100) -> List[Dict]:`.
      - `getMoviesYears` : `sorted(set(m['year'] for m in self.mdao.findAll() if m.get('year')))` donne les années distinctes triées.
      - Retours homogènes : `getMovieById` renvoie **toujours une liste** (`[movie]` ou `[]`), ce qui simplifie les templates.
      - Le service ne fait pas de SQL. Pour pouvoir le tester, on peut lui **injecter** le DAO.
    example: |
      from typing import List, Dict
      from flask import current_app
      from app.models.MovieDAO import MovieSqliteDAO as MovieDAO

      class MovieService:
          def __init__(self, db_path=None):
              if db_path is None:
                  db_path = current_app.config['DATABASE_PATH']
              self.mdao = MovieDAO(db_path)

          def getMovieById(self, num: int) -> List[Dict]:
              res = self.mdao.findById(num)
              if type(res) is not list:          # on force toujours une liste
                  res = [res]
              return res

          def getMoviesYears(self) -> List[int]:
              return sorted(list(set([m["year"] for m in self.mdao.findAll() if m.get("year")])))
