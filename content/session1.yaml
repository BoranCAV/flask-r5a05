  - id: "1.7"
    palier: 3
    title: "Le modèle classique (domaine : bibliothèque)"
    memo: |
      - Un modèle représente des données **sans** traitement. Son constructeur a des valeurs par défaut à `None`.
      - `to_dict()` retourne un dictionnaire (utile pour `jsonify`).
      - `__getitem__(self, item)` → `getattr(self, item)` : permet d'écrire `movie['title']` comme `movie.title`, pratique en Jinja.
      - `__contains__(self, item)` → `hasattr(self, item)` : permet de tester `'title' in movie`.
      - `__repr__` : une représentation lisible pour `print`, par exemple `<Movie id=1 title=Matrix year=1999>`.
      - Méthode utile : `from_dict(cls, d)` (`@classmethod`) pour créer un objet depuis une ligne SQL convertie en `dict`.
    example: |
      class Movie:
          """représentation abstraite d'un film"""
          def __init__(self, id=None, title=None, year=None):
              self.id = id
              self.title = title
              self.year = year

          def to_dict(self):
              return {"id": self.id, "title": self.title, "year": self.year}

          def __getitem__(self, item):        # movie['title']
              return getattr(self, item)

          def __contains__(self, item):       # 'title' in movie
              return hasattr(self, item)

          def __repr__(self):                 # print(movie)
              return f"<Movie id={self.id} title={self.title} year={self.year}>"
