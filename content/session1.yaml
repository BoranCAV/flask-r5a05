        solution: |
          Les blueprints découpent le backend en composants autonomes, en général un par fonctionnalité.
          Chaque blueprint a ses propres routes (@bp.route), ses templates, ses fichiers statiques et son préfixe d'URL.
          Il est rattaché explicitement à l'application avec app.register_blueprint(), ce qui évite les
          problèmes d'imports circulaires dus au contexte global @app.route.
          Enfin, chaque développeur peut travailler sur son blueprint avant de le brancher (un peu comme une
          branche git), et un blueprint est réutilisable d'un projet à l'autre.

