        grille:
          - {critere: "`Artist` : `__tablename__ = 'artists'`, `name` unique et obligatoire", points: 1}
          - {critere: "`albums = relationship('Album', back_populates='artist', cascade='all, delete-orphan')`", points: 1.5, auto: test_relations}
