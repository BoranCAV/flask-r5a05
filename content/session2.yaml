  - id: "2.7"
    palier: 3
    title: "Cascades et suppressions"
    memo: |
      - `ForeignKey('movies.id', ondelete='CASCADE')` agit **dans la base** : supprimer le film supprime ses lignes filles.
      - `ForeignKey('directors.id', ondelete='SET NULL')` met la clé à NULL quand le parent disparaît. La colonne doit alors être `nullable=True`.
      - `cascade='all, delete-orphan'`, sur la `relationship` du **parent**, agit **dans l'ORM** : `session.delete(movie)` supprime aussi son détail et ses avis, et un enfant retiré de la collection (un orphelin) est supprimé.
      - Sans cascade de suppression, SQLAlchemy met à NULL la clé des enfants quand on supprime le parent.
      - `default=datetime.utcnow` **sans parenthèses** : la fonction est appelée à chaque insertion. Avec `()`, la date serait figée au chargement du module.
      - `default=func.current_timestamp()` : c'est la base qui calcule la valeur.
    example: |
      class Movie(Base, BaseModelMixin):
          __tablename__ = 'movies'
          id = Column(Integer, primary_key=True)
          # le film disparaît → ses avis aussi (ORM)
          reviews = relationship('Review', back_populates='movie', cascade='all, delete-orphan')

      class Review(Base, BaseModelMixin):
          __tablename__ = 'reviews'
          id = Column(Integer, primary_key=True)
          # le film disparaît → ses avis aussi (base de données)
          movie_id = Column(Integer, ForeignKey('movies.id', ondelete='CASCADE'), nullable=False)
          created_at = Column(DateTime, default=datetime.utcnow)     # sans () !
          movie = relationship('Movie', back_populates='reviews')
