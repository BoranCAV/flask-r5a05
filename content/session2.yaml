      - type: papier
        tags: [loading, n-plus-1, session-orm]
        enonce: "Question de cours : qu'est-ce que le problème N+1 ? Quand utiliser `joinedload` plutôt que `selectinload` ? À quoi sert `expire_on_commit=False` ?"
        duree: 360
        grille:
          - {critere: "N+1 : en lazy loading, 1 requête pour la liste plus 1 requête par objet pour chaque relation", points: 1}
          - {critere: "`joinedload` : une seule requête avec LEFT OUTER JOIN, adaptée aux relations to-one (N-1, 1-1)", points: 1}
          - {critere: "`selectinload` : une requête secondaire avec IN, adaptée aux collections (1-N, N-N), sans duplication", points: 1}
          - {critere: "`expire_on_commit=False` : les objets restent lisibles après le commit et la fermeture de la session", points: 1}
        solution: |
          En lazy loading (le défaut), chaque relation est chargée au premier accès : afficher N albums et leur
          artiste coûte 1 requête + N requêtes, c'est le problème N+1.
          joinedload ajoute un LEFT OUTER JOIN à la requête principale : une seule requête, idéal pour les
          relations to-one (album.artist, movie.detail).
          selectinload exécute une seconde requête avec IN (ids des parents) : pas de lignes dupliquées,
          plus efficace pour les collections (album.genres, album.tracks).
          expire_on_commit=False empêche SQLAlchemy d'expirer les attributs au commit : les objets renvoyés par
          le DAO restent utilisables après session.close() (dans le service ou le template).
