      - type: code
        tags: [mixin]
        enonce: |
          Écris le mixin `BaseModelMixin` du TD02, sans constructeur :
          - `__getitem__(item)` renvoie l'attribut, ou lève `KeyError` s'il n'existe pas ;
          - `to_dict()` renvoie `{nom_colonne: valeur}` pour chaque colonne de `self.__table__.columns`, et formate les `datetime` en `"%Y-%m-%d %H:%M:%S"`.
          Le modèle de test `Review(Base, BaseModelMixin)` est déclaré **après** ton code.
        starter: |
          from datetime import datetime


          class BaseModelMixin:
              pass
        tests: |
          from datetime import datetime
          from sqlalchemy import Column, Integer, String, DateTime
          from sqlalchemy.orm import declarative_base
          _Base = declarative_base()

          class Review(_Base, BaseModelMixin):
              __tablename__ = "reviews"
              id = Column(Integer, primary_key=True)
              comment = Column(String(100))
              created_at = Column(DateTime)

          def test_getitem():
              """review['comment'] renvoie l'attribut"""
              assert Review(id=1, comment="top")["comment"] == "top"

          def test_keyerror():
              """review['inconnu'] lève KeyError"""
              try:
                  Review()["inconnu"]
              except KeyError:
                  return
              except Exception as e:
                  raise AssertionError(f"il faut lever KeyError, pas {type(e).__name__}")
              raise AssertionError("aucune erreur levée")

          def test_to_dict():
              """to_dict() renvoie les 3 colonnes, avec la date formatée"""
              r = Review(id=1, comment="top", created_at=datetime(2026, 1, 15, 9, 30, 0))
              assert r.to_dict() == {"id": 1, "comment": "top", "created_at": "2026-01-15 09:30:00"}, f"obtenu {r.to_dict()}"

          def test_pas_de_init():
              """le mixin ne définit pas de __init__"""
              assert "__init__" not in BaseModelMixin.__dict__
        solution: |
          from datetime import datetime


          class BaseModelMixin:
              """mixin pour les modèles ORM : accès dictionnaire + sérialisation"""

              def __getitem__(self, item):
                  if hasattr(self, item):
                      return getattr(self, item)
                  raise KeyError(f"L'objet '{self.__class__.__name__}' n'a pas l'attribut '{item}'")

              def to_dict(self):
                  result = {}
                  for col in self.__table__.columns:
                      val = getattr(self, col.name)
                      if isinstance(val, datetime):
                          val = val.strftime("%Y-%m-%d %H:%M:%S")
                      result[col.name] = val
                  return result
        indices: ["`col.name` donne le nom de la colonne, et `getattr(self, col.name)` sa valeur."]
      - type: code
        tags: [property, mixin, mro]
        enonce: |
          Écris le mixin `HeroStatsMixin`, qui sera utilisé par `class Superhero(HeroStatsMixin)`. On suppose que l'objet a une liste `self.missions`, dont chaque mission a `danger_level` (1 à 5) et `status`.
          - `@property average_danger` : la moyenne des `danger_level` arrondie à 1 décimale, ou `None` s'il n'y a pas de mission ;
          - `@property completed_missions_count` : le nombre de missions au statut `"Completed"` ;
          - `@staticmethod danger_label(level)` : `"faible"` si le niveau vaut 2 ou moins, `"moyen"` s'il vaut 3, `"élevé"` au-delà.
        starter: |
          class HeroStatsMixin:
              pass
        tests: |
          class _M:
              def __init__(self, d, s):
                  self.danger_level, self.status = d, s

          class Superhero(HeroStatsMixin):
              def __init__(self, missions):
                  self.missions = missions

          def test_moyenne():
              """average_danger (sans parenthèses) vaut 3.3"""
              h = Superhero([_M(3, "Completed"), _M(5, "Completed"), _M(2, "En cours")])
              assert h.average_danger == 3.3, f"obtenu {h.average_danger!r} (as-tu mis @property ?)"

          def test_moyenne_vide():
              """sans mission, average_danger vaut None"""
              assert Superhero([]).average_danger is None

          def test_completed():
              """completed_missions_count compte les missions 'Completed'"""
              h = Superhero([_M(3, "Completed"), _M(5, "Completed"), _M(2, "En cours")])
              assert h.completed_missions_count == 2

          def test_static():
              """danger_label est une méthode statique (appelable sur la classe)"""
              assert HeroStatsMixin.danger_label(1) == "faible" and HeroStatsMixin.danger_label(3) == "moyen" and HeroStatsMixin.danger_label(5) == "élevé"
        solution: |
          class HeroStatsMixin:
              """statistiques réutilisables pour tout objet qui possède des missions"""

              @property
              def average_danger(self):
                  if not self.missions:
                      return None
                  return round(sum(m.danger_level for m in self.missions) / len(self.missions), 1)

              @property
              def completed_missions_count(self):
                  return len([m for m in self.missions if m.status == "Completed"])

              @staticmethod
              def danger_label(level):
                  if level <= 2:
                      return "faible"
                  if level == 3:
                      return "moyen"
                  return "élevé"
        indices: ["`@property` au-dessus de `def average_danger(self):`, et `@staticmethod` au-dessus de `def danger_label(level):`, sans `self`."]

