        tests: |
          def _albums():
              dao = AlbumSqliteORM("sqlite://")
              _fill(dao.engine)
              s = dao.connect()
              res = dao._query_with_relations(s).order_by(Album.id).all()
              s.close()
              return res

          def test_to_one():
              """album.artist lisible après close (joinedload)"""
              try:
                  assert _albums()[0].artist.name == "Miles Davis"
              except Exception as e:
                  raise AssertionError(f"{type(e).__name__} sur artist")

          def test_to_many():
              """album.genres et album.tracks lisibles après close (selectinload)"""
              try:
                  a = _albums()[0]
                  assert len(a.genres) == 2 and len(a.tracks) == 2
              except Exception as e:
                  raise AssertionError(f"{type(e).__name__} sur genres/tracks")
        grille:
          - {critere: "`return session.query(Album).options(...)`", points: 1}
          - {critere: "`joinedload(Album.artist)` (to-one)", points: 1.5, auto: test_to_one}
          - {critere: "`selectinload(Album.genres)` et `selectinload(Album.tracks)` (to-many)", points: 1.5, auto: test_to_many}
        solution: |
          class AlbumSqliteORM(AlbumDAOInterface):
              def __init__(self, db_uri="sqlite:///music.db"):
                  self.engine = create_engine(db_uri, echo=False)
                  self.SessionFactory = sessionmaker(bind=self.engine, expire_on_commit=False)

              def connect(self):
                  return self.SessionFactory()

              def _query_with_relations(self, session):
                  """requête de base : relations chargées d'avance (pas de N+1)"""
                  return session.query(Album).options(
                      joinedload(Album.artist),
                      selectinload(Album.genres),
                      selectinload(Album.tracks)
                  )
      - type: papier
        tags: [dao-orm, try-finally, query]
        enonce: "Écris `findAll(limit=None)` (triés par titre) et `findById(id)` (qui renvoie `[album]` ou `[]`), avec `try / finally`. Recopie ce dont tu as besoin."
        duree: 360
        setup: *music_models
        tests: |
          def _dao():
              dao = AlbumSqliteORM("sqlite://")
              _fill(dao.engine)
              return dao

          def test_findAll():
              """findAll() trié par titre, findAll(2) limité"""
              dao = _dao()
              assert [a.title for a in dao.findAll()] == ["Blue Train", "Giant Steps", "Kind of Blue"]
              assert len(dao.findAll(limit=2)) == 2

          def test_findById():
              """findById(1) renvoie [Kind of Blue], findById(99) renvoie []"""
              dao = _dao()
              res = dao.findById(1)
              assert isinstance(res, list) and len(res) == 1 and res[0].title == "Kind of Blue"
              assert dao.findById(99) == []
        grille:
          - {critere: "`session = self.connect()` puis `try: ... finally: session.close()`", points: 1.5}
          - {critere: "`findAll` : `order_by(Album.title)` puis `.limit(limit)` si `limit` est donné", points: 1.5, auto: test_findAll}
          - {critere: "`findById` : `filter(Album.id == id).first()` puis `[album] if album else []`", points: 1.5, auto: test_findById}
        solution: |
          class AlbumSqliteORM(AlbumDAOInterface):
              def __init__(self, db_uri="sqlite:///music.db"):
                  self.engine = create_engine(db_uri, echo=False)
                  self.SessionFactory = sessionmaker(bind=self.engine, expire_on_commit=False)

              def connect(self):
                  return self.SessionFactory()

              def _query_with_relations(self, session):
                  return session.query(Album).options(
                      joinedload(Album.artist), selectinload(Album.genres), selectinload(Album.tracks)
                  )

              def findAll(self, limit=None):
                  session = self.connect()
                  try:
                      query = self._query_with_relations(session).order_by(Album.title)
                      if limit is not None:
                          query = query.limit(limit)
                      return query.all()
                  finally:
                      session.close()

