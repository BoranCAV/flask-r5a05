      - type: papier
        tags: [property, relation-1N]
        enonce: "Écris `Track`, puis `Album` avec la relation `tracks` et deux `@property` : `tracks_count` et `duration_total` (la somme des durées, 0 s'il n'y a pas de piste). La classe `Artist` existe déjà."
        duree: 420
        setup: |
          from sqlalchemy import Column, Integer, String
          from sqlalchemy.orm import declarative_base, relationship
          Base = declarative_base()
          class BaseModelMixin:
              pass
          fake_module("app.models.base", Base=Base, BaseModelMixin=BaseModelMixin)
          class Artist(Base):
              __tablename__ = "artists"
              id = Column(Integer, primary_key=True)
              name = Column(String(150))
              albums = relationship("Album", back_populates="artist")
        tests: |
          from sqlalchemy import inspect

          def test_track():
              """tracks.album_id : FK albums.id ; Track.album ↔ Album.tracks"""
              fk = list(Track.__table__.c.album_id.foreign_keys)[0]
              assert fk.target_fullname == "albums.id"
              assert inspect(Track).relationships["album"].back_populates == "tracks"

          def test_properties():
              """tracks_count et duration_total sont des propriétés"""
              a = Album(title="Discovery")
              a.tracks = [Track(title="One More Time", duration=320), Track(title="Aerodynamic", duration=212)]
              assert a.tracks_count == 2, "a.tracks_count sans parenthèses : @property"
              assert a.duration_total == 532

          def test_vide():
              """duration_total vaut 0 sans piste"""
              assert Album(title="x").duration_total == 0
        grille:
          - {critere: "`Track` : `album_id` FK `albums.id` (`ondelete='CASCADE'`, `nullable=False`) + `album = relationship(...)`", points: 1.5, auto: test_track}
          - {critere: "`Album.tracks = relationship('Track', back_populates='album', cascade='all, delete-orphan')`", points: 1, auto: test_track}
          - {critere: "`@property tracks_count` → `len(self.tracks)`", points: 1, auto: test_properties}
          - {critere: "`@property duration_total` → `sum(t.duration for t in self.tracks)` (0 si vide)", points: 1, auto: test_vide}
        solution: |
          from sqlalchemy import Column, Integer, String, ForeignKey
          from sqlalchemy.orm import relationship
          from app.models.base import Base, BaseModelMixin


          class Album(Base, BaseModelMixin):
              __tablename__ = 'albums'
              id = Column(Integer, primary_key=True, autoincrement=True)
              title = Column(String(255), nullable=False)
              year = Column(Integer)
              artist_id = Column(Integer, ForeignKey('artists.id', ondelete='CASCADE'))
              artist = relationship('Artist', back_populates='albums')
              tracks = relationship('Track', back_populates='album', cascade='all, delete-orphan')

              @property
              def tracks_count(self):
                  return len(self.tracks)

              @property
              def duration_total(self):
                  return sum(t.duration or 0 for t in self.tracks)


          class Track(Base, BaseModelMixin):
              __tablename__ = 'tracks'
              id = Column(Integer, primary_key=True, autoincrement=True)
              title = Column(String(255))
              duration = Column(Integer, default=0)
              album_id = Column(Integer, ForeignKey('albums.id', ondelete='CASCADE'), nullable=False)
              album = relationship('Album', back_populates='tracks')
      - type: papier
        tags: [super, relation-NN, mixin]
        enonce: "Écris `Album` avec sa relation N-N `genres` (table `album_genres` fournie) et une surcharge de `__getitem__`, pour que `album['genres']` renvoie `\"Jazz, Modal\"`. Les autres clés passent par le mixin. `Genre` existe déjà."
        duree: 360
        setup: |
          from sqlalchemy import Column, Integer, String, ForeignKey, Table
          from sqlalchemy.orm import declarative_base, relationship
          Base = declarative_base()
          class BaseModelMixin:
              def __getitem__(self, item):
                  if hasattr(self, item):
                      return getattr(self, item)
                  raise KeyError(item)
          album_genres = Table("album_genres", Base.metadata,
              Column("album_id", Integer, ForeignKey("albums.id", ondelete="CASCADE"), primary_key=True),
              Column("genre_id", Integer, ForeignKey("genres.id", ondelete="CASCADE"), primary_key=True))
          fake_module("app.models.base", Base=Base, BaseModelMixin=BaseModelMixin)
          fake_module("app.models.associations", album_genres=album_genres)
          class Genre(Base):
              __tablename__ = "genres"
              id = Column(Integer, primary_key=True)
              name = Column(String(100))
              albums = relationship("Album", secondary=album_genres, back_populates="genres")
        tests: |
          from sqlalchemy import inspect

          def test_relation():
              """genres = relationship('Genre', secondary=album_genres, back_populates='albums')"""
              r = inspect(Album).relationships["genres"]
              assert r.secondary.name == "album_genres" and r.back_populates == "albums"

          def test_getitem_genres():
              """album['genres'] renvoie 'Jazz, Modal'"""
              a = Album(title="Kind of Blue")
              a.genres = [Genre(name="Jazz"), Genre(name="Modal")]
              assert a["genres"] == "Jazz, Modal", f"obtenu {a['genres']!r}"

          def test_getitem_autre():
              """album['title'] passe par le mixin (super)"""
              assert Album(title="Kind of Blue")["title"] == "Kind of Blue"
              try:
                  Album(title="x")["inconnu"]
                  raise AssertionError("les autres clés doivent passer par super().__getitem__")
              except KeyError:
                  pass
        grille:
          - {critere: "`genres = relationship('Genre', secondary=album_genres, back_populates='albums')`", points: 1.5, auto: test_relation}
          - {critere: "`if item == 'genres': return \", \".join(g.name for g in self.genres)`", points: 1.5, auto: test_getitem_genres}
          - {critere: "`return super().__getitem__(item)` pour les autres clés", points: 1.5, auto: test_getitem_autre}
        solution: |
          from sqlalchemy import Column, Integer, String
          from sqlalchemy.orm import relationship
          from app.models.base import Base, BaseModelMixin
          from app.models.associations import album_genres


          class Album(Base, BaseModelMixin):
              __tablename__ = 'albums'
              id = Column(Integer, primary_key=True, autoincrement=True)
              title = Column(String(255), nullable=False)
              genres = relationship('Genre', secondary=album_genres, back_populates='albums')

              def __getitem__(self, item):
                  """polymorphisme par surcharge : album['genres'] renvoie une chaîne"""
                  if item == "genres":
                      return ", ".join(g.name for g in self.genres)
                  return super().__getitem__(item)
      - type: papier
        tags: [mro, mixin]
        enonce: "Question de cours : qu'est-ce qu'un mixin ? Pourquoi `class Album(Base, BaseModelMixin)` dans cet ordre ? Qu'est-ce que le MRO ?"
        duree: 300
        grille:
          - {critere: "Un mixin est une classe secondaire, jamais instanciée, qui apporte des méthodes réutilisables", points: 1}
          - {critere: "C'est un des rares cas d'héritage multiple autorisé (« héritage partiel »), sans hiérarchie rigide", points: 1}
          - {critere: "Le MRO (algorithme C3) fixe l'ordre de recherche des méthodes : de gauche à droite", points: 1}
          - {critere: "L'ordre (Base, BaseModelMixin) suit la consigne du TD, et c'est le 1er parent qui l'emporte en cas de conflit", points: 1}
        solution: |
          Un mixin est une classe secondaire qui n'est jamais instanciée seule (pas de __init__). Elle injecte
          des comportements transversaux (to_dict, __getitem__, horodatage…) dans plusieurs classes, par
          héritage multiple, sans créer de hiérarchie rigide : c'est un « héritage partiel ».
          Le MRO (Method Resolution Order, algorithme C3) détermine l'ordre de recherche des attributs et des
          méthodes : Python parcourt les parents de gauche à droite (Album → Base → … → BaseModelMixin).
          En cas de méthode portant le même nom, c'est celle du premier parent listé qui est utilisée :
          l'ordre (Base, BaseModelMixin) demandé dans le TD est donc important.
      - type: papier
        tags: [session-orm, commit, create-all]
        enonce: "Écris `remplir(engine)` : elle crée les tables, ouvre une session, ajoute l'artiste « Daft Punk » et ses albums « Discovery » (2001) et « Homework » (1997) avec `add_all`, puis valide et ferme la session. Les modèles `Artist` et `Album` sont fournis."
        duree: 300
        setup: |
          from sqlalchemy import Column, Integer, String, ForeignKey
          from sqlalchemy.orm import declarative_base, relationship, sessionmaker
          Base = declarative_base()
          class Artist(Base):
              __tablename__ = "artists"
              id = Column(Integer, primary_key=True)
              name = Column(String(150), unique=True, nullable=False)
              albums = relationship("Album", back_populates="artist", cascade="all, delete-orphan")
          class Album(Base):
              __tablename__ = "albums"
              id = Column(Integer, primary_key=True)
              title = Column(String(255), nullable=False)
              year = Column(Integer)
              artist_id = Column(Integer, ForeignKey("artists.id", ondelete="CASCADE"), nullable=False)
              artist = relationship("Artist", back_populates="albums")
        tests: |
          from sqlalchemy import create_engine

          def test_remplir():
              """remplir(engine) crée 1 artiste et 2 albums"""
              e = create_engine("sqlite://")
              remplir(e)
              s = sessionmaker(bind=e)()
              assert s.query(Artist).count() == 1, "un seul artiste attendu"
              assert sorted(a.title for a in s.query(Album).all()) == ["Discovery", "Homework"]
        grille:
          - {critere: "`Base.metadata.create_all(engine)`", points: 1, auto: test_remplir}
          - {critere: "`Session = sessionmaker(bind=engine)` puis `session = Session()`", points: 1}
          - {critere: "Création des objets et `session.add_all([...])`", points: 1, auto: test_remplir}
          - {critere: "`session.commit()` puis `session.close()`", points: 1.5}
        solution: |
          def remplir(engine):
              Base.metadata.create_all(engine)
              Session = sessionmaker(bind=engine)
              session = Session()
              dp = Artist(name="Daft Punk")
              albums = [Album(title="Discovery", year=2001, artist=dp), Album(title="Homework", year=1997, artist=dp)]
              session.add_all([dp] + albums)
              session.commit()
              session.close()

  - id: "2.12"
    palier: 4
    title: "Sujet papier C : le DAO ORM AlbumSqliteORM"
    memo: |
      **Sujet.** Les modèles `Artist`, `Album`, `Genre` et `Track` existent (dans `app/models/`). `Album.artist` est en N-1, `Album.genres` en N-N et `Album.tracks` en 1-N.
      - Tu écris le DAO `AlbumSqliteORM(AlbumDAOInterface)` sur le modèle du `MovieSqliteORM` du TD02.
      - Chaque méthode ouvre une session et la ferme dans un `finally`.
    exercises:
      - type: papier
        tags: [dao-orm, engine, session-orm]
        enonce: "Écris l'en-tête du DAO : les imports, `__init__(self, db_uri)` (avec `self.engine` et `self.SessionFactory`, `expire_on_commit=False`) et `connect()`."
        duree: 300
        setup: *music_models
        tests: |
          def test_engine():
              """dao.engine est un moteur SQLAlchemy"""
              from sqlalchemy.engine import Engine
              assert isinstance(AlbumSqliteORM("sqlite://").engine, Engine)

          def test_connect():
              """connect() renvoie une session avec expire_on_commit=False"""
              from sqlalchemy.orm import Session as _S
              s = AlbumSqliteORM("sqlite://").connect()
              assert isinstance(s, _S), "connect() doit renvoyer self.SessionFactory()"
              assert s.expire_on_commit is False, "sessionmaker(bind=self.engine, expire_on_commit=False)"
              s.close()
        grille:
          - {critere: "Imports de `sessionmaker`, `joinedload`, `selectinload` et des modèles", points: 1}
          - {critere: "`self.engine = create_engine(db_uri)` (ou `get_engine`)", points: 1, auto: test_engine}
          - {critere: "`self.SessionFactory = sessionmaker(bind=self.engine, expire_on_commit=False)`", points: 1.5, auto: test_connect}
          - {critere: "`def connect(self): return self.SessionFactory()`", points: 1, auto: test_connect}
        solution: |
          from sqlalchemy import create_engine
          from sqlalchemy.orm import sessionmaker, joinedload, selectinload
          from app.models.AlbumDAOInterface import AlbumDAOInterface
          from app.models.Album import Album
          from app.models.Genre import Genre
          from app.models.Artist import Artist


          class AlbumSqliteORM(AlbumDAOInterface):
              """DAO des albums utilisant l'ORM"""

              def __init__(self, db_uri="sqlite:///music.db"):
                  self.engine = create_engine(db_uri, echo=False)
                  self.SessionFactory = sessionmaker(bind=self.engine, expire_on_commit=False)

              def connect(self):
                  """retourne une nouvelle session ORM"""
                  return self.SessionFactory()
      - type: papier
