  - id: "2.8"
    palier: 3
    title: "Charger efficacement : lazy, joinedload, selectinload, N+1"
    memo: |
      - Le **lazy loading** est le comportement par défaut : une relation n'est chargée qu'au premier accès, avec une requête de plus **par objet**. Pour N films, ça fait 1 + N requêtes : c'est le **problème N+1**.
      - Après `session.close()`, un accès lazy provoque `DetachedInstanceError`, typiquement dans un template.
      - L'**eager loading** se fait avec `.options(...)` :
      - `joinedload(Movie.director)` fait un LEFT OUTER JOIN dans la même requête. Idéal pour les relations **to-one** (`director`, `detail`).
      - `selectinload(Movie.genres)` lance une 2e requête avec `IN (...)`, sans duplication. Idéal pour les **collections** (`genres`, `actors`, `reviews`).
      - `_query_with_relations(session)` centralise ces options dans le DAO.
      - `.join(Movie.genres).filter(Genre.name.ilike(x))` sert à **filtrer** sur une relation. Ce n'est pas du chargement.
    example: |
      def _query_with_relations(self, session):
          """requête de base qui charge d'avance toutes les relations"""
          return session.query(Movie).options(
              joinedload(Movie.director),      # to-one : jointure
              joinedload(Movie.detail),        # to-one : jointure
              selectinload(Movie.genres),      # to-many : requête IN
              selectinload(Movie.actors),
              selectinload(Movie.reviews)
          )

      def findByGenre(self, genre_name):
          session = self.connect()
          try:
              return (
                  self._query_with_relations(session)
                  .join(Movie.genres)                       # jointure pour filtrer
                  .filter(Genre.name.ilike(genre_name))
                  .all()
              )
          finally:
              session.close()
