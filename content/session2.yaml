session:
  id: 2
  title: "ORM et mixins"
  subtitle: "SQLAlchemy déclaratif, sessions, requêtes, relations 1-N / 1-1 / N-N, cascades, chargement, mixins et MRO."

lessons:
  # ===================================================================== PALIER 1
  - id: "2.1"
    palier: 1
    title: "Pourquoi un ORM ?"
    memo: |
      - **ORM** (Object Relational Mapping) : une couche d'abstraction qui synchronise le schéma SQL et les classes Python.
      - Une table correspond à une classe (un modèle), une ligne à une instance, une colonne à un attribut de type `Column`.
      - SQLAlchemy propose deux approches. L'approche **déclarative**, utilisée dans le cours, part du modèle Python. L'approche manuelle (impérative) part du schéma.
      - `engine = create_engine("sqlite:///films.db", echo=True)` : le moteur lié à la base. Avec `echo=True`, il affiche les requêtes SQL générées.
      - `Base = declarative_base()` : la classe de base dont héritent tous les modèles.
      - `Base.metadata.create_all(engine)` crée toutes les tables des modèles qui héritent de `Base`.
      - On n'écrit plus de SQL à la main, mais la logique SQL (clés, jointures) reste indispensable.
    example: |
      from sqlalchemy.orm import declarative_base, sessionmaker
      from sqlalchemy import Column, Integer, String, TIMESTAMP
      from sqlalchemy import create_engine, func

      # moteur lié à la base ; echo=True affiche le SQL généré
      engine = create_engine("sqlite:///films.db", echo=True)

      # base déclarative : tous les modèles en héritent
      Base = declarative_base()

      class Film(Base):
          __tablename__ = "films"
          id = Column(Integer, primary_key=True)
          titre = Column(String, nullable=False)

      def creation():
          Base.metadata.create_all(engine)    # crée les tables d'après les modèles
    exercises:
      - type: qcm
        tags: [orm-principe]
        enonce: "Avec un ORM, à quoi correspond une **ligne** d'une table ?"
        choices: ["À une instance du modèle", "À une classe", "À un attribut `Column`", "À une session"]
        answer: 0
        explication: "Table ↔ classe, ligne ↔ instance, colonne ↔ attribut."
      - type: vf
        tags: [engine]
        enonce: "`create_engine(\"sqlite:///films.db\", echo=True)` affiche dans la console les requêtes SQL générées par l'ORM."
        answer: true
        explication: "`echo=True` active les journaux SQL : pratique pour voir ce que l'ORM fait réellement."
      - type: qcm
        tags: [declarative-base, orm-principe]
        enonce: "Quelle approche de SQLAlchemy le cours utilise-t-il ?"
        choices: ["Déclarative : on écrit les classes Python qui héritent de `Base`", "Impérative : on mappe à la main un schéma existant", "Uniquement le moteur SQL, sans ORM", "Aucune : on écrit du SQL brut"]
        answer: 0
        explication: "L'approche déclarative est la plus simple : le modèle Python décrit la table."
      - type: trous
        tags: [engine, declarative-base]
        enonce: "Complète le début de `films.py`."
        code: |
          from sqlalchemy.orm import [[0]], sessionmaker
          from sqlalchemy import create_engine

          engine = [[1]]("sqlite:///films.db", echo=True)
          Base = declarative_base()
        blanks:
          - ["declarative_base"]
          - ["create_engine"]
      - type: ordre
        tags: [orm-principe, create-all]
        enonce: "Remets dans l'ordre les étapes du petit test ORM du TD02."
        lines:
          - "Importer declarative_base, sessionmaker, Column, create_engine…"
          - "Créer le moteur : engine = create_engine(...)"
          - "Créer la base : Base = declarative_base()"
          - "Déclarer le modèle class Film(Base) avec ses colonnes"
          - "Créer les tables : Base.metadata.create_all(engine)"
          - "Ouvrir une session et ajouter des films"
      - type: relier
        tags: [orm-principe]
        enonce: "Relie chaque notion SQL à son équivalent ORM."
        pairs:
          - ["Table", "Classe qui hérite de Base (modèle)"]
          - ["Ligne", "Instance du modèle"]
          - ["Colonne", "Attribut déclaré avec Column(...)"]
          - ["Schéma complet", "Base.metadata"]
      - type: vf
        tags: [orm-principe]
        enonce: "Avec un ORM, il n'est plus nécessaire de comprendre la logique du SQL (clés étrangères, jointures)."
        answer: false
        explication: "Faux : on n'écrit plus le SQL, mais il faut toujours penser en clés, relations et jointures. Le TD02 insiste là-dessus."

  - id: "2.2"
    palier: 1
    title: "Le modèle déclaratif : __tablename__ et Column"
    memo: |
      - `class Film(Base):` puis `__tablename__ = "films"` : le **nom de la table**, en minuscules et souvent au pluriel. C'est ce nom qu'utilise `ForeignKey`.
      - `id = Column(Integer, primary_key=True)` : la clé primaire, auto-incrémentée par défaut.
      - Les types : `Integer`, `String(150)`, `Text`, `Float`, `DateTime`, `TIMESTAMP`.
      - Les options : `nullable=False` (NOT NULL), `unique=True`, `index=True`, `default=0`, `default=func.current_timestamp()`.
      - `Base.metadata.create_all(engine)` crée les tables qui n'existent pas encore.
      - Le constructeur `__init__` est facultatif : SQLAlchemy accepte `Film(titre="2046")`. Le cours en écrit souvent un.
    example: |
      class Actor(Base, BaseModelMixin):
          """un acteur"""
          __tablename__ = 'actors'                       # nom de la table

          id = Column(Integer, primary_key=True, autoincrement=True)
          name = Column(String(150), unique=True, nullable=False, index=True)

          def __init__(self, name=None):
              self.name = name                           # l'id est auto-incrémenté
    exercises:
      - type: qcm
        tags: [tablename]
        enonce: "Quel attribut de classe fixe le nom de la table SQL d'un modèle ?"
        choices: ["`__tablename__`", "`__table__`", "`__name__`", "`table_name`"]
        answer: 0
        explication: "`__tablename__ = 'actors'`. Ensuite, `__table__` est l'objet `Table` que SQLAlchemy construit à partir du modèle."
      - type: trous
        tags: [column-options]
        enonce: "Complète la colonne `name` : texte de 150 caractères maximum, obligatoire, unique et indexé."
        code: |
          name = Column([[0]](150), [[1]]=True, nullable=[[2]], index=True)
        blanks:
          - ["String"]
          - ["unique"]
          - ["False"]
      - type: vf
        tags: [column-options]
        enonce: "Une colonne `Column(Integer, primary_key=True)` est auto-incrémentée par défaut."
        answer: true
        explication: "Vrai pour une clé primaire entière seule. Le cours ajoute parfois `autoincrement=True` pour être explicite."
      - type: relier
        tags: [column-options]
        enonce: "Relie chaque option de `Column` à son effet."
        pairs:
          - ["primary_key=True", "Clé primaire de la table"]
          - ["nullable=False", "Valeur obligatoire (NOT NULL)"]
          - ["unique=True", "Deux lignes ne peuvent pas avoir la même valeur"]
          - ["index=True", "Index pour accélérer les recherches sur cette colonne"]
          - ["default=0", "Valeur utilisée si rien n'est fourni à l'insertion"]
      - type: ordre
        tags: [tablename, column-options]
        enonce: "Remets dans l'ordre le modèle `Film` du TD02."
        lines:
          - "class Film(Base):"
          - "    __tablename__ = \"films\""
          - "    id = Column(Integer, primary_key=True)"
          - "    created = Column(TIMESTAMP, default=func.current_timestamp())"
          - "    titre = Column(String, nullable=False)"
          - "    qualite = Column(Integer, default=0)"
        explication: "On déclare la classe, puis `__tablename__`, puis les colonnes. L'ordre des colonnes suit ici celui du TD."
      - type: qcm
        tags: [create-all]
        enonce: "Que fait `Base.metadata.create_all(engine)` ?"
        choices:
          - "Elle crée dans la base toutes les tables des modèles qui héritent de `Base` (si elles n'existent pas)"
          - "Elle insère des lignes de test"
          - "Elle supprime puis recrée toutes les tables"
          - "Elle ouvre une session"
        answer: 0

  - id: "2.3"
    palier: 1
    title: "Les sessions : add, commit, close"
    memo: |
      - `Session = sessionmaker(bind=engine)` : une **fabrique** de sessions, liée au moteur.
      - `session = Session()` : une session, c'est-à-dire une transaction avec la base.
      - `session.add(film)` / `session.add_all([f1, f2])` : ajoute les objets à la session.
      - `session.commit()` **persiste** les changements. Sans commit, rien n'est écrit dans la base.
      - `session.rollback()` annule la transaction en cours, par exemple après une erreur.
      - `session.close()` ferme la session. Bonne pratique : des sessions **courtes**, toujours fermées.
      - `sessionmaker(bind=engine, expire_on_commit=False)` : les objets restent lisibles après le commit et la fermeture (utilisé dans le DAO du TD02).
    example: |
      def remplir():
          Session = sessionmaker(bind=engine)      # fabrique de sessions
          session = Session()                      # une session (transaction)
          data = [("2046", 10), ("Mon nom est personne", 7)]
          films = [Film(titre=d[0], qualite=d[1]) for d in data]
          session.add_all(films)                   # ajout
          session.commit()                         # persistance
          session.close()                          # fermeture

      def explorer():
          Session = sessionmaker(bind=engine)
          session = Session()
          for f in session.query(Film).all():
              print(f.titre)
          session.close()
    exercises:
      - type: ordre
        tags: [session-orm, commit, close]
        enonce: "Remets dans l'ordre la fonction `remplir()`."
        lines:
          - "Session = sessionmaker(bind=engine)"
          - "session = Session()"
          - "films = [Film(titre=t) for t in ['2046', 'Star Wars 7']]"
          - "session.add_all(films)"
          - "session.commit()"
          - "session.close()"
      - type: qcm
        tags: [commit]
        enonce: "On fait `session.add(film)` puis `session.close()`, sans `commit()`. Le film est-il en base ?"
        choices: ["Non : sans commit, la transaction est annulée", "Oui, `add` suffit", "Oui, `close` fait un commit", "Seulement si `echo=True`"]
        answer: 0
        explication: "`commit()` persiste les changements. Fermer une session qui n'a pas été commitée annule la transaction."
      - type: qcm
        tags: [commit, close]
        enonce: "Quelles **deux** lignes manquent après `session.add_all(films)` dans l'exemple « Quelle est l'erreur ? » du CM02 ?"
        choices: ["`session.commit()`", "`session.close()`", "`session.rollback()`", "`Base.metadata.create_all(engine)`"]
        answer: [0, 1]
        explication: "Il faut persister les changements (`commit`), puis fermer la connexion (`close`)."
      - type: vf
        tags: [session-orm]
        enonce: "`sessionmaker(bind=engine)` renvoie directement une session prête à l'emploi."
        answer: false
        explication: "Faux : il renvoie une **classe** (une fabrique). On l'appelle ensuite (`Session()`) pour obtenir une session."
      - type: trous
        tags: [session-orm, query]
        enonce: "Complète `explorer()`, qui affiche tous les films."
        code: |
          def explorer():
              Session = sessionmaker(bind=engine)
              session = [[0]]
              res = session.[[1]](Film).[[2]]()
              for r in res:
                  print(r.to_dict())
              session.[[3]]()
        blanks:
          - ["Session()"]
          - ["query"]
          - ["all"]
          - ["close"]
      - type: relier
        tags: [session-orm, commit, close]
        enonce: "Relie chaque méthode de session à son effet."
        pairs:
          - ["add_all", "Ajoute une liste d'objets à la session"]
          - ["commit", "Écrit définitivement les changements en base"]
          - ["rollback", "Annule les changements non commités"]
          - ["close", "Ferme la session et libère la connexion"]

  # ===================================================================== PALIER 2
  - id: "2.4"
    palier: 2
    title: "Requêter sans SQL : query, filter, order_by, distinct, ilike"
    memo: |
      - `session.query(Movie)` part de la table des films. On enchaîne ensuite les méthodes.
      - `.filter(Movie.year == 1999)` (avec **`==`**), `.filter(Movie.year.isnot(None))`, `.filter(Director.name.ilike(f"%{name}%"))` (insensible à la casse).
      - `.order_by(Movie.title)`, `.order_by(Movie.year.desc())`, `.limit(10)`, `.distinct()`.
      - Fin de chaîne : `.all()` (une liste), `.first()` (un objet ou `None`), `.count()` (un entier).
      - `session.query(Movie.year)` ne sélectionne qu'une colonne. Le résultat est une liste de **tuples**, d'où `[y[0] for y in years]`.
      - Mettre la chaîne entre parenthèses permet de l'écrire sur plusieurs lignes.
    example: |
      def getMoviesYears(self):
          """années distinctes et triées"""
          session = self.mdao.connect()
          try:
              years = (
                  session.query(Movie.year)
                  .filter(Movie.year.isnot(None))
                  .distinct()
                  .order_by(Movie.year)
                  .all()
              )
              return [y[0] for y in years]      # liste de tuples → liste d'entiers
          finally:
              session.close()
    exercises:
      - type: trous
        tags: [query, filter]
        enonce: "Complète la requête qui renvoie les films de 1999."
        code: |
          movies = session.query(Movie).[[0]](Movie.year [[1]] 1999).[[2]]()
        blanks:
          - ["filter"]
          - ["=="]
          - ["all"]
        explication: "`filter` attend une expression de comparaison : on écrit `==`, pas `=`."
      - type: trous
        tags: [query, distinct]
        enonce: "Complète `getMoviesYears()`."
        code: |
          years = (
              session.query(Movie.year)
              .filter(Movie.year.[[0]](None))
              .[[1]]()
              .order_by(Movie.year)
              .all()
          )
          return [y[[[2]]] for y in years]
        blanks:
          - ["isnot"]
          - ["distinct"]
          - ["0"]
      - type: qcm
        tags: [query]
        enonce: "Que renvoie `session.query(Movie).filter(Movie.id == 999).first()` si aucun film n'a l'id 999 ?"
        choices: ["`None`", "`[]`", "Une exception `NoResultFound`", "`0`"]
        answer: 0
        explication: "`first()` renvoie le premier résultat ou `None`. C'est `all()` qui renverrait `[]`."
      - type: ordre
        tags: [query, try-finally]
        enonce: "Remets dans l'ordre la méthode du DAO ORM (session toujours fermée)."
        lines:
          - "def findByYear(self, year):"
          - "    session = self.connect()"
          - "    try:"
          - "        return session.query(Movie).filter(Movie.year == year).all()"
          - "    finally:"
          - "        session.close()"
      - type: relier
        tags: [query, filter, ilike, distinct]
        enonce: "Relie chaque méthode à ce qu'elle fait."
        pairs:
          - [".filter(...)", "Garde les lignes qui vérifient une condition (WHERE)"]
          - [".order_by(...)", "Trie les résultats (ORDER BY)"]
          - [".distinct()", "Supprime les doublons"]
          - [".count()", "Renvoie le nombre de lignes"]
          - [".ilike('%x%')", "Comparaison de texte insensible à la casse avec jokers"]
      - type: qcm
        tags: [query]
        enonce: "Que contient `session.query(Movie.year).distinct().all()` ?"
        choices: ["Une liste de tuples, par exemple `[(1999,), (2004,)]`", "Une liste d'entiers `[1999, 2004]`", "Une liste d'objets `Movie`", "Un seul entier"]
        answer: 0
        explication: "Une requête sur des colonnes renvoie des lignes (des tuples). D'où `[y[0] for y in years]`."
      - type: trous
        tags: [ilike, filter]
        enonce: "Complète la recherche des réalisateurs dont le nom **contient** `name`, sans tenir compte de la casse."
        code: |
          session.query(Director).filter(Director.name.[[0]](f"[[1]]")).all()
        blanks:
          - ["ilike"]
          - ["%{name}%"]

  - id: "2.5"
    palier: 2
    title: "Relations 1-N / N-1 : ForeignKey, relationship, back_populates"
    memo: |
      - Côté **N** (l'enfant, ex. `Movie`) : `director_id = Column(Integer, ForeignKey('directors.id'))`. On y écrit le **nom de la table**.
      - Côté N toujours : `director = relationship('Director', back_populates='movies')`. On y écrit le **nom de la classe**.
      - Côté **1** (le parent, ex. `Director`) : `movies = relationship('Movie', back_populates='director')`. C'est une collection, d'où le pluriel.
      - `back_populates` se met **des deux côtés**, et chacun donne le nom de l'attribut d'en face.
      - La clé étrangère est toujours du côté N.
      - À l'usage : `movie.director.name` (un objet) et `director.movies` (une liste).
    example: |
      class Director(Base, BaseModelMixin):
          __tablename__ = 'directors'
          id = Column(Integer, primary_key=True, autoincrement=True)
          name = Column(String(150), unique=True, nullable=False)
          # 1-N : un réalisateur possède une collection de films
          movies = relationship('Movie', back_populates='director')

      class Movie(Base, BaseModelMixin):
          __tablename__ = 'movies'
          id = Column(Integer, primary_key=True, autoincrement=True)
          title = Column(String(255), nullable=False)
          # N-1 : clé étrangère vers la TABLE directors
          director_id = Column(Integer, ForeignKey('directors.id', ondelete='SET NULL'), nullable=True)
          director = relationship('Director', back_populates='movies')
    exercises:
      - type: trous
        tags: [relation-1N, foreign-key, back-populates]
        enonce: "Complète le côté N (`Movie`) de la relation avec `Director`."
        code: |
          director_id = Column(Integer, ForeignKey([[0]]), nullable=True)
          director = relationship([[1]], back_populates=[[2]])
        blanks:
          - ["'directors.id'"]
          - ["'Director'"]
          - ["'movies'"]
        indices: ["`ForeignKey` prend `table.colonne`, et `relationship` prend le nom de la **classe**."]
      - type: trous
        tags: [relation-1N, back-populates]
        enonce: "Complète le côté 1 (`Director`)."
        code: |
          class Director(Base, BaseModelMixin):
              __tablename__ = 'directors'
              id = Column(Integer, primary_key=True)
              [[0]] = relationship('Movie', back_populates=[[1]])
        blanks:
          - ["movies"]
          - ["'director'"]
      - type: qcm
        tags: [foreign-key, relation-1N]
        enonce: "Un réalisateur a plusieurs films, et un film a un seul réalisateur. Dans quelle table met-on la clé étrangère ?"
        choices: ["`movies` (côté N)", "`directors` (côté 1)", "Dans une table d'association", "Dans les deux tables"]
        answer: 0
        explication: "Chaque film pointe vers **son** réalisateur, donc la FK `director_id` est dans `movies`."
      - type: ordre
        tags: [relation-1N, foreign-key]
        enonce: "Remets dans l'ordre le modèle `Review`, qui est en N-1 avec `Movie`."
        lines:
          - "class Review(Base, BaseModelMixin):"
          - "    __tablename__ = 'reviews'"
          - "    id = Column(Integer, primary_key=True, autoincrement=True)"
          - "    movie_id = Column(Integer, ForeignKey('movies.id', ondelete='CASCADE'), nullable=False)"
          - "    movie = relationship('Movie', back_populates='reviews')"
      - type: relier
        tags: [foreign-key, back-populates]
        enonce: "Relie chaque élément à ce qu'on y écrit."
        pairs:
          - ["ForeignKey('…')", "Le nom de la table et la colonne : 'directors.id'"]
          - ["relationship('…')", "Le nom de la classe cible : 'Director'"]
          - ["back_populates='…'", "Le nom de l'attribut de la relation d'en face"]
          - ["Côté 1 de la relation", "Un attribut au pluriel qui contient une liste"]
      - type: qcm
        tags: [relation-1N]
        enonce: "Que vaut `director.movies` pour un réalisateur qui a 3 films ?"
        choices: ["Une liste de 3 objets `Movie`", "L'entier 3", "Le premier film", "Une requête pas encore exécutée"]
        answer: 0
      - type: vf
        tags: [back-populates]
        enonce: "Il suffit de déclarer `back_populates` d'un seul côté de la relation."
        answer: false
        explication: "Faux : avec `back_populates`, on déclare la relation **des deux côtés**, et chacun nomme l'attribut de l'autre."

  - id: "2.6"
    palier: 2
    title: "Relations 1-1 et N-N : uselist, Table d'association, secondary"
    memo: |
      - **1-1**, côté parent : `detail = relationship('MovieDetail', back_populates='movie', uselist=False)`. On obtient un objet, pas une liste.
      - 1-1, côté enfant : `movie_id = Column(Integer, ForeignKey('movies.id', ondelete='CASCADE'), unique=True, nullable=False, index=True)`. Le `unique=True` garantit qu'il y a un seul détail par film.
      - **N-N** : une table d'association sans classe, dans `associations.py` :
      - `movie_genres = Table('movie_genres', Base.metadata, Column('movie_id', Integer, ForeignKey('movies.id', ondelete='CASCADE'), primary_key=True), Column('genre_id', ...))`
      - Des deux côtés : `genres = relationship('Genre', secondary=movie_genres, back_populates='movies')`.
      - La clé primaire est composée des deux colonnes : un couple (film, genre) n'apparaît qu'une fois.
    example: |
      # associations.py
      movie_genres = Table(
          'movie_genres',
          Base.metadata,
          Column('movie_id', Integer, ForeignKey('movies.id', ondelete='CASCADE'), primary_key=True),
          Column('genre_id', Integer, ForeignKey('genres.id', ondelete='CASCADE'), primary_key=True)
      )

      class Genre(Base, BaseModelMixin):
          __tablename__ = 'genres'
          id = Column(Integer, primary_key=True)
          name = Column(String(100), unique=True, nullable=False)
          movies = relationship('Movie', secondary=movie_genres, back_populates='genres')

      # dans Movie :
      # genres = relationship('Genre', secondary=movie_genres, back_populates='movies')
      # detail = relationship('MovieDetail', back_populates='movie', uselist=False, cascade='all, delete-orphan')
    exercises:
      - type: trous
        tags: [association-table, relation-NN]
        enonce: "Complète la table d'association entre `movies` et `actors`."
        code: |
          movie_actors = [[0]](
              'movie_actors',
              [[1]],
              Column('movie_id', Integer, ForeignKey('movies.id', ondelete='CASCADE'), [[2]]=True),
              Column('actor_id', Integer, ForeignKey([[3]], ondelete='CASCADE'), primary_key=True)
          )
        blanks:
          - ["Table"]
          - ["Base.metadata"]
          - ["primary_key"]
          - ["'actors.id'"]
      - type: trous
        tags: [relation-NN, back-populates]
        enonce: "Complète la relation N-N dans `Actor`."
        code: |
          movies = relationship(
              'Movie',
              [[0]]=movie_actors,
              back_populates=[[1]]
          )
        blanks:
          - ["secondary"]
          - ["'actors'"]
      - type: qcm
        tags: [relation-11]
        enonce: "À quoi sert `uselist=False` dans `detail = relationship('MovieDetail', back_populates='movie', uselist=False)` ?"
        choices: ["`movie.detail` renvoie un objet unique au lieu d'une liste", "Il interdit les doublons dans la table", "Il désactive la relation inverse", "Il charge le détail en même temps que le film"]
        answer: 0
      - type: ordre
        tags: [association-table]
        enonce: "Remets dans l'ordre la table `hero_powers` du TD03."
        lines:
          - "hero_powers = Table("
          - "    'hero_powers',"
          - "    Base.metadata,"
          - "    Column('hero_id', Integer, ForeignKey('superheroes.id', ondelete='CASCADE'), primary_key=True),"
          - "    Column('power_id', Integer, ForeignKey('powers.id', ondelete='CASCADE'), primary_key=True)"
          - ")"
      - type: relier
