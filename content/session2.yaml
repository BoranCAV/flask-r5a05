  - id: "2.9"
    palier: 3
    title: "Mixins, héritage multiple, MRO, @property et super()"
    memo: |
      - Un **mixin** est une classe secondaire, jamais instanciée seule, qui apporte des méthodes réutilisables par héritage multiple. On parle d'« héritage partiel ».
      - `class Actor(Base, BaseModelMixin)` : l'**ordre compte**. Le **MRO** (algorithme C3) cherche les méthodes de gauche à droite (`Actor.__mro__`).
      - `BaseModelMixin.to_dict()` parcourt `self.__table__.columns`. `__getitem__` lève `KeyError` si l'attribut n'existe pas.
      - `@property` : une méthode qui se lit comme un attribut (`movie.average_rating`, sans parenthèses).
      - `@staticmethod` : une méthode sans `self`, rangée dans la classe pour l'organisation.
      - Surcharge : `Movie.__getitem__` traite le cas `'genres'` puis délègue le reste à `super().__getitem__(item)`.
    example: |
      class BaseModelMixin:
          """mixin : jamais instancié, pas de __init__"""
          def __getitem__(self, item):
              if hasattr(self, item):
                  return getattr(self, item)
              raise KeyError(f"L'objet '{self.__class__.__name__}' n'a pas l'attribut '{item}'")

          def to_dict(self):
              result = {}
              for col in self.__table__.columns:
                  val = getattr(self, col.name)
                  if isinstance(val, datetime):
                      val = val.strftime("%Y-%m-%d %H:%M:%S")
                  result[col.name] = val
              return result

      class Movie(Base, BaseModelMixin):
          @property
          def average_rating(self):                       # movie.average_rating
              if not self.reviews:
                  return None
              return round(sum(r.rating for r in self.reviews) / len(self.reviews), 1)

          def __getitem__(self, item):                    # surcharge
              if item == "genres":
                  return ", ".join(g.name for g in self.genres)
              return super().__getitem__(item)            # cas général : le mixin
