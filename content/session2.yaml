      - type: papier
        tags: [back-populates, cascade, ondelete, relation-11]
        enonce: "Question de cours : explique `back_populates`, `uselist=False`, et la différence entre `ondelete='CASCADE'` et `cascade='all, delete-orphan'`."
        duree: 360
        grille:
          - {critere: "`back_populates` relie les deux côtés d'une relation (nom de l'attribut d'en face), déclaré des deux côtés", points: 1}
          - {critere: "`uselist=False` : l'attribut renvoie un objet unique (1-1) au lieu d'une liste", points: 1}
          - {critere: "`ondelete='CASCADE'` : règle de la **base de données** sur la clé étrangère", points: 1}
          - {critere: "`cascade='all, delete-orphan'` : règle de l'**ORM** sur la relation du parent (suppression via la session, orphelins)", points: 1}
        solution: |
          back_populates synchronise les deux côtés d'une relation : chaque relationship donne le nom de
          l'attribut d'en face (Author.books ↔ Book.author). Il se déclare des deux côtés.
          uselist=False transforme la collection en objet unique : book.detail est un BookDetail (1-1).
          ondelete='CASCADE' est une contrainte SQL portée par la clé étrangère : la BASE supprime les lignes
          filles quand le parent disparaît.
          cascade='all, delete-orphan' est un comportement de l'ORM, déclaré sur la relationship du parent :
          session.delete(book) supprime aussi son détail, et un enfant détaché de son parent est supprimé.

  - id: "2.11"
    palier: 4
    title: "Sujet papier B : musique, mixin, cascades et @property"
    memo: |
      **Sujet.** Le schéma de la base :
      - `artists(id PK, name VARCHAR(150) NOT NULL UNIQUE, country)`
      - `albums(id PK, title VARCHAR(255) NOT NULL, year INTEGER, artist_id INTEGER NOT NULL REFERENCES artists(id) ON DELETE CASCADE)`
      - `tracks(id PK, title, duration INTEGER (en secondes), album_id NOT NULL REFERENCES albums(id) ON DELETE CASCADE)`
      - `genres(id PK, name UNIQUE)` et la table d'association `album_genres`.
      - `Base` et `BaseModelMixin` viennent de `app/models/base.py`.
    exercises:
      - type: papier
        tags: [mixin]
        enonce: "Écris `BaseModelMixin` : `__getitem__` (qui lève `KeyError` si l'attribut est absent) et `to_dict()` (avec les `datetime` formatées en `%Y-%m-%d %H:%M:%S`)."
        duree: 300
        tests: |
          from datetime import datetime
          from sqlalchemy import Column, Integer, String, DateTime
          from sqlalchemy.orm import declarative_base
          _B = declarative_base()
          class _R(_B, BaseModelMixin):
              __tablename__ = "r"
              id = Column(Integer, primary_key=True)
              name = Column(String(10))
              at = Column(DateTime)

          def test_getitem():
              """obj['name'] fonctionne, obj['x'] lève KeyError"""
              assert _R(name="a")["name"] == "a"
              try:
                  _R()["x"]
                  raise AssertionError("pas de KeyError")
              except KeyError:
                  pass

          def test_to_dict():
              """to_dict formate les datetime"""
              assert _R(id=1, name="a", at=datetime(2026, 3, 1, 8, 0, 0)).to_dict() == {"id": 1, "name": "a", "at": "2026-03-01 08:00:00"}
        grille:
          - {critere: "`__getitem__` : `hasattr` → `getattr`, sinon `raise KeyError(...)`", points: 1.5, auto: test_getitem}
          - {critere: "`to_dict` : boucle sur `self.__table__.columns` et `result[col.name]`", points: 1.5, auto: test_to_dict}
          - {critere: "Formatage des `datetime` avec `strftime`", points: 1, auto: test_to_dict}
          - {critere: "Pas de constructeur (un mixin n'est jamais instancié)", points: 0.5}
        solution: |
          from datetime import datetime


          class BaseModelMixin:
              def __getitem__(self, item):
                  if hasattr(self, item):
                      return getattr(self, item)
                  raise KeyError(f"L'objet '{self.__class__.__name__}' n'a pas l'attribut '{item}'")

              def to_dict(self):
                  result = {}
                  for col in self.__table__.columns:
                      val = getattr(self, col.name)
                      if isinstance(val, datetime):
                          val = val.strftime("%Y-%m-%d %H:%M:%S")
                      result[col.name] = val
                  return result
