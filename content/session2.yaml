  - id: "2.10"
    palier: 4
    title: "Sujet papier A : bibliothèque en ORM"
    memo: |
      **Sujet.** Traduis ce schéma SQL en modèles SQLAlchemy (approche déclarative, `Base` + `BaseModelMixin`) :
      - `authors(id PK, name VARCHAR(150) NOT NULL UNIQUE, country VARCHAR(100))`
      - `books(id PK, title VARCHAR(255) NOT NULL, year INTEGER, author_id INTEGER REFERENCES authors(id) ON DELETE SET NULL)`
      - `book_details(id PK, book_id INTEGER NOT NULL UNIQUE REFERENCES books(id) ON DELETE CASCADE, pages INTEGER, isbn VARCHAR(20))`
      - `tags(id PK, name VARCHAR(50) NOT NULL UNIQUE)`
      - `book_tags(book_id REFERENCES books(id) ON DELETE CASCADE, tag_id REFERENCES tags(id) ON DELETE CASCADE, PRIMARY KEY(book_id, tag_id))`
      - Les relations sont : auteur 1-N livres, livre 1-1 détail, livre N-N tags.
    exercises:
      - type: papier
        tags: [declarative-base, mixin, engine]
        enonce: "Écris `app/models/base.py` : `Base`, le mixin `BaseModelMixin` (`__getitem__` et `to_dict`) et `get_engine(db_uri=None)`, qui renvoie un moteur SQLAlchemy (`sqlite:///library.db` par défaut)."
        duree: 420
        tests: |
          def test_base():
              """Base est une base déclarative (elle a metadata)"""
              assert hasattr(Base, "metadata"), "Base = declarative_base()"

          def test_mixin():
              """BaseModelMixin a __getitem__ et to_dict, mais pas de __init__"""
              assert callable(getattr(BaseModelMixin, "__getitem__", None)) and callable(getattr(BaseModelMixin, "to_dict", None))
              assert "__init__" not in BaseModelMixin.__dict__

          def test_engine():
              """get_engine('sqlite://') renvoie un moteur SQLAlchemy"""
              from sqlalchemy.engine import Engine
              e = get_engine("sqlite://")
              assert isinstance(e, Engine) and str(e.url) == "sqlite://"

          def test_to_dict():
              """to_dict() d'un modèle renvoie ses colonnes"""
              from sqlalchemy import Column, Integer, String
              class _T(Base, BaseModelMixin):
                  __tablename__ = "t_test"
                  id = Column(Integer, primary_key=True)
                  name = Column(String(10))
              assert _T(id=1, name="x").to_dict() == {"id": 1, "name": "x"}
              assert _T(name="y")["name"] == "y"
        grille:
          - {critere: "`Base = declarative_base()` (import depuis `sqlalchemy.orm`)", points: 1, auto: test_base}
          - {critere: "`BaseModelMixin.__getitem__` : `getattr` si `hasattr`, sinon `raise KeyError`", points: 1, auto: test_to_dict}
          - {critere: "`to_dict()` : boucle sur `self.__table__.columns`, clé `col.name`", points: 1.5, auto: test_to_dict}
          - {critere: "Pas de `__init__` dans le mixin", points: 0.5, auto: test_mixin}
          - {critere: "`get_engine` : URI par défaut puis `return create_engine(db_uri, echo=False)`", points: 1, auto: test_engine}
        solution: |
          import os
          from datetime import datetime
          from sqlalchemy import create_engine
          from sqlalchemy.orm import declarative_base

          Base = declarative_base()


          class BaseModelMixin:
              """mixin : accès type dictionnaire + sérialisation (jamais instancié)"""

              def __getitem__(self, item):
                  if hasattr(self, item):
                      return getattr(self, item)
                  raise KeyError(f"L'objet '{self.__class__.__name__}' n'a pas l'attribut '{item}'")

              def to_dict(self):
                  result = {}
                  for col in self.__table__.columns:
                      val = getattr(self, col.name)
                      if isinstance(val, datetime):
                          val = val.strftime("%Y-%m-%d %H:%M:%S")
                      result[col.name] = val
                  return result


          def get_engine(db_uri=None):
              if db_uri is None:
                  db_uri = "sqlite:///library.db"
              return create_engine(db_uri, echo=False)
