<!doctype html>
<html lang="fr" data-bs-theme="light">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ metadata.title }} · Flask R5.A.05</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath fill=%22%23f59e0b%22 d=%22M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.5L12 17.3l-5.9 3.2 1.3-6.5L2.5 9.4l6.6-.8z%22/%3E%3C/svg%3E">
	<script>
		// thème appliqué avant l'affichage (pas de flash) : choix mémorisé, sinon préférence du système
		(function () {
			var t = null;
			try { t = localStorage.getItem('theme'); } catch (e) {}
			if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			document.documentElement.setAttribute('data-bs-theme', t);
		})();
	</script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
	<link id="hljs-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" disabled>
	<link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
	{% include 'nav.html' %}
	<main id="main" class="container py-4" style="max-width: 1100px;">
		{% block content %}{% endblock %}
	</main>
	<footer class="container pb-4 small text-muted-2" style="max-width: 1100px;">
		Entraînement R5.A.05 · contenu tiré du cours de G. Guibon · hors contrôle : Jinja et gestion des utilisateurs
	</footer>

	<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
		<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.5L12 17.3l-5.9 3.2 1.3-6.5L2.5 9.4l6.6-.8z"/></symbol>
	</svg>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
	<script>
		function applyHljsTheme() {
			var dark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
			document.getElementById('hljs-light').disabled = dark;
			document.getElementById('hljs-dark').disabled = !dark;
		}
		applyHljsTheme();
		document.getElementById('theme-toggle').addEventListener('click', function () {
			var next = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
			document.documentElement.setAttribute('data-bs-theme', next);
			try { localStorage.setItem('theme', next); } catch (e) {}
			this.setAttribute('aria-pressed', next === 'dark');
			applyHljsTheme();
			document.dispatchEvent(new CustomEvent('themechange', { detail: next }));
		});
		if (window.hljs) document.querySelectorAll('pre.code-block code').forEach(function (el) { hljs.highlightElement(el); });
	</script>
	{% block scripts %}{% endblock %}
</body>
</html>
