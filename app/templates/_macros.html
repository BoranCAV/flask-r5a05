{# étoiles : n pleines sur max #}
{% macro stars(n, max=3, cls='') -%}
<span class="stars {{ cls }}" role="img" aria-label="{{ n }} étoile{{ 's' if n > 1 }} sur {{ max }}">
	{%- for i in range(max) -%}
	<svg class="star {{ 'on' if i < n }}" aria-hidden="true"><use href="#i-star"/></svg>
	{%- endfor -%}
</span>
{%- endmacro %}

{# total d'étoiles : "12 / 36" + barre #}
{% macro star_total(s, label='') -%}
<div>
	<div class="d-flex justify-content-between small mb-1">
		<span class="text-muted-2">{{ label }}</span>
		<span class="nav-stars"><svg class="star on" aria-hidden="true" style="width:.9em;height:.9em"><use href="#i-star"/></svg> {{ s.got }} / {{ s.max }}</span>
	</div>
	<div class="progress" role="progressbar" aria-label="{{ label or 'Étoiles' }}" aria-valuenow="{{ s.got }}" aria-valuemin="0" aria-valuemax="{{ s.max }}">
		<div class="progress-bar bar-star" style="width: {{ (100 * s.got / s.max) if s.max else 0 }}%"></div>
	</div>
</div>
{%- endmacro %}
